<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a235a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>STC Express</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
  --brd:#334155;--brd2:#475569;
  --tx:#f1f5f9;--tx2:#94a3b8;--tx3:#64748b;
  --acc:#3b82f6;--grn:#10b981;--red:#ef4444;--amb:#f59e0b;--pur:#8b5cf6;
  --fn:'DM Sans',sans-serif;--mo:'DM Mono',monospace;
  --r:14px;--r2:10px;
  --fs:clamp(14px,3.8vw,16px);--fsm:clamp(12px,3.2vw,14px);--fss:clamp(11px,2.8vw,12px);
  --h:clamp(44px,12vw,52px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;touch-action:manipulation}
body{background:var(--bg);color:var(--tx);font-family:var(--fn);font-size:var(--fs);height:100%;display:flex;flex-direction:column;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}
.bar{background:var(--bg2);border-bottom:1px solid var(--brd);padding:0 14px;display:flex;align-items:center;gap:10px;height:var(--h);flex-shrink:0}
.bar-back{width:34px;height:34px;border-radius:8px;border:1px solid var(--brd2);background:none;color:var(--tx);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.bar-back.vis{display:flex}
.bar-title{font-size:clamp(14px,4vw,16px);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sub{font-size:var(--fss);color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.pg{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.nav{background:var(--bg2);border-top:1px solid var(--brd);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;padding:9px 2px;border:none;background:none;color:var(--tx3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--fss);font-family:var(--fn);min-height:var(--h)}
.nb.on{color:var(--acc)}
.nb svg{width:22px;height:22px}
.card{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:background .15s}
.card:active{background:var(--bg3)}
.card-row{display:flex;align-items:center;gap:12px}
.ci{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ct{font-weight:500;font-size:var(--fsm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{font-size:var(--fss);color:var(--tx2);margin-top:2px}
.b{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:var(--fss);font-weight:500;font-family:var(--mo);white-space:nowrap}
.b-bl{background:rgba(59,130,246,.15);color:#93c5fd}
.b-gr{background:rgba(16,185,129,.15);color:#6ee7b7}
.b-am{background:rgba(245,158,11,.15);color:#fcd34d}
.b-rd{background:rgba(239,68,68,.15);color:#fca5a5}
.b-pu{background:rgba(139,92,246,.15);color:#c4b5fd}
.b-gy{background:rgba(100,116,139,.15);color:var(--tx2)}
.btn{font-family:var(--fn);font-size:var(--fsm);font-weight:600;border:none;border-radius:var(--r2);padding:0 18px;height:42px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--acc);color:#fff}
.btn-g{background:var(--grn);color:#fff}
.btn-d{background:var(--red);color:#fff}
.btn-o{background:transparent;border:1px solid var(--brd2);color:var(--tx)}
.btn-w{width:100%}
.btn-s{height:36px;font-size:var(--fss);padding:0 12px}
.btn:disabled{opacity:.4;pointer-events:none}
.inp{font-family:var(--fn);font-size:var(--fsm);background:var(--bg);border:1px solid var(--brd2);color:var(--tx);border-radius:var(--r2);padding:0 14px;height:42px;width:100%;outline:none;transition:border .2s}
.inp:focus{border-color:var(--acc)}
.sel{appearance:none;background:var(--bg) url("data:image/svg+xml,%3Csvg viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%2394a3b8' fill='none' stroke-width='1.5'/%3E%3C/svg%3E") no-repeat right 12px center/10px;padding-right:32px}
label{display:block;font-size:var(--fss);color:var(--tx2);margin-bottom:5px;font-weight:500}
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.dlg-bg.open{display:flex}
.dlg{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:20px;max-width:380px;width:100%;max-height:80vh;overflow-y:auto}
.dlg-t{font-size:var(--fs);font-weight:600;margin-bottom:8px}
.dlg-m{font-size:var(--fsm);color:var(--tx2);margin-bottom:14px}
.dlg-g{font-family:var(--mo);font-size:var(--fss);color:var(--tx3);margin-bottom:14px;word-break:break-all}
.dlg-a{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;bottom:calc(var(--h) + env(safe-area-inset-bottom) + 14px);left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r2);padding:10px 18px;font-size:var(--fsm);font-weight:500;z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.ok{border-color:var(--grn);color:var(--grn)}
#toast.er{border-color:var(--red);color:var(--red)}
#toast.wa{border-color:var(--amb);color:var(--amb)}
#toast.show{opacity:1}
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px;gap:12px}
.sp{width:28px;height:28px;border:3px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--tx3);padding:30px 10px;font-size:var(--fsm)}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stat{flex:1;min-width:72px;background:var(--bg);border:1px solid var(--brd);border-radius:var(--r2);padding:10px;text-align:center}
.stat-n{font-size:clamp(18px,5vw,24px);font-weight:700;font-family:var(--mo)}
.stat-l{font-size:var(--fss);color:var(--tx2);margin-top:2px}
.progress{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin:8px 0}
.progress-bar{height:100%;background:var(--acc);border-radius:3px;transition:width .4s}
.scan-area{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;max-height:42vh}
.scan-area video{width:100%;height:100%;object-fit:cover}
.scan-line{position:absolute;top:50%;left:10%;right:10%;height:2px;background:var(--red);box-shadow:0 0 8px var(--red);animation:scanmove 2s ease-in-out infinite;transition:background .2s,box-shadow .2s}
@keyframes scanmove{0%,100%{top:30%}50%{top:70%}}
.scan-result{padding:7px 12px;border-radius:var(--r2);margin-bottom:5px;font-family:var(--mo);font-size:var(--fss);display:flex;align-items:center;gap:8px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.file-drop{border:2px dashed var(--brd2);border-radius:var(--r);padding:28px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.file-drop:hover,.file-drop.drag{border-color:var(--acc);background:rgba(59,130,246,.05)}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fss)}
.tbl th{text-align:left;padding:7px 8px;color:var(--tx2);border-bottom:1px solid var(--brd);font-weight:500;white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--brd);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.seg{display:flex;background:var(--bg);border:1px solid var(--brd);border-radius:var(--r2);padding:3px;gap:3px;margin-bottom:14px}
.seg-btn{flex:1;padding:7px 4px;border:none;background:none;color:var(--tx2);border-radius:8px;cursor:pointer;font-size:var(--fss);font-family:var(--fn);font-weight:500;transition:background .15s,color .15s;white-space:nowrap}
.seg-btn.on{background:var(--bg2);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sec-title{font-size:var(--fsm);font-weight:600;color:var(--tx2);margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-family:var(--mo);font-weight:600;background:rgba(59,130,246,.12);color:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <button class="bar-back" id="btnBack" onclick="goBack()">←</button>
    <div style="flex:1;min-width:0">
      <div class="bar-title" id="pgT">STC Express</div>
      <div class="bar-sub" id="pgS"></div>
    </div>
    <div id="barRight"></div>
  </header>
  <main class="pg" id="pg"></main>
  <nav class="nav" id="mainNav" style="display:none">
    <button class="nb on" id="nb0" onclick="go('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Hoy
    </button>
    <button class="nb" id="nb1" onclick="go('contenedores')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6-3 6 3M6 9v10c0 1 .5 2 2 2h8c1.5 0 2-1 2-2V9M9 6v3M15 6v3"/></svg>Contenedores
    </button>
    <button class="nb" id="nb2" onclick="go('scanner')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v2M3 15v2M7 3h2M15 3h2M21 7v2M21 15v2M7 21h2M15 21h2M7 7h10v10H7z"/></svg>Scan
    </button>
    <button class="nb" id="nb3" onclick="go('buscar')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>Buscar
    </button>
    <button class="nb" id="nb4" onclick="go('menu')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Menú
    </button>
  </nav>
</div>

<div class="dlg-bg" id="dlgBg" onclick="if(event.target===this)closeDlg()">
  <div class="dlg">
    <div class="dlg-t" id="dlgT"></div>
    <div class="dlg-m" id="dlgM"></div>
    <div class="dlg-g" id="dlgG"></div>
    <div class="dlg-a" id="dlgA"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const S={user:null,profile:null,scanCb:null,scanStream:null,stack:[],page:'login'};
const sb=window.supabase.createClient(
  'https://xxxxxxxxxxx.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
);

function esc(t){return String(t).replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));}

function toast(m,t){
  const el=document.getElementById('toast');
  el.textContent=m;
  el.className='';if(t)el.classList.add(t);
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

function dialog(t,m,g,btns){
  document.getElementById('dlgT').textContent=t;
  document.getElementById('dlgM').textContent=m;
  document.getElementById('dlgG').textContent=g;
  const aEl=document.getElementById('dlgA');aEl.innerHTML='';
  if(btns.length===0){
    const b=document.createElement('button');
    b.className='btn btn-p btn-s btn-w';
    b.textContent='OK';
    b.onclick=closeDlg;
    aEl.appendChild(b);
  }else{
    btns.forEach(btn=>{
      const b=document.createElement('button');
      b.className='btn btn-s '+(btn.c||'btn-p');
      b.textContent=btn.l;
      b.onclick=btn.fn;
      aEl.appendChild(b);
    });
  }
  document.getElementById('dlgBg').classList.add('open');
}

function closeDlg(){
  document.getElementById('dlgBg').classList.remove('open');
}

function go(pg,saveStack=true){
  if(saveStack&&S.page!==pg)S.stack.push(S.page);
  S.page=pg;
  document.querySelectorAll('.nb').forEach((b,i)=>{
    b.classList.toggle('on',i===['home','contenedores','scanner','buscar','menu'].indexOf(pg));
  });
  document.getElementById('btnBack').classList.toggle('vis',S.stack.length>0);
  const pgEl=document.getElementById('pg');
  pgEl.innerHTML='<div class="ld"><div class="sp"></div><span style="color:var(--tx3)">Cargando...</span></div>';
  
  if(pg==='login')renderLogin();
  else if(pg==='home')renderHome();
  else if(pg==='contenedores')renderContenedores();
  else if(pg==='scanner')renderScanner();
  else if(pg==='buscar')renderBuscar();
  else if(pg==='menu')renderMenu();
  else pgEl.innerHTML='<p style="color:var(--red)">Página no encontrada</p>';
}

function goBack(){
  if(S.stack.length>0){
    const prev=S.stack.pop();
    go(prev,false);
  }
}

function renderLogin(){
  document.getElementById('pg').innerHTML=`
    <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:20px;text-align:center">
      <div style="font-size:clamp(24px,8vw,48px);font-weight:700;margin-bottom:30px;background:linear-gradient(135deg,var(--acc),var(--pur));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">
        STC Express
      </div>
      <div style="width:100%;max-width:300px">
        <label>Usuario</label>
        <input class="inp" id="loginU" placeholder="Tu usuario" style="margin-bottom:14px">
        <label>Contraseña</label>
        <input class="inp" id="loginP" type="password" placeholder="Tu contraseña" style="margin-bottom:20px" onkeypress="if(event.key==='Enter')pgLogin()">
        <button class="btn btn-p btn-w" onclick="pgLogin()">Entrar</button>
        <div id="loginErr" style="margin-top:12px;color:var(--red);font-size:var(--fsm)"></div>
      </div>
    </div>
  `;
}

async function pgLogin(){
  const u=document.getElementById('loginU').value.trim();
  const p=document.getElementById('loginP').value;
  if(!u||!p){
    document.getElementById('loginErr').textContent='Usuario y contraseña requeridos';
    return;
  }
  try{
    const{data,error}=await sb.auth.signInWithPassword({email:`${u}@stcexpress.local`,password:p});
    if(error)throw error;
    S.user=data.session.user;
    const{data:prof}=await sb.from('profiles').select('*').eq('id',S.user.id).single();
    S.profile=prof;
    if(prof&&prof.activo){
      go('home',false);
    }else{
      document.getElementById('loginErr').textContent='Usuario no activo';
    }
  }catch(e){
    document.getElementById('loginErr').textContent='Error: '+e.message;
  }
}

function renderHome(){
  document.getElementById('pg').innerHTML=`<p style="padding:20px">Bienvenido, ${esc(S.profile?.nombre_completo||'Usuario')}!</p>`;
}

function renderContenedores(){
  document.getElementById('pg').innerHTML=`<p style="padding:20px">Contenedores (en desarrollo)</p>`;
}

function renderScanner(){
  document.getElementById('pg').innerHTML=`
    <div style="padding-top:0">
      <div id="scanArea" class="scan-area" style="margin-bottom:14px">
        <video id="scanVid"></video>
        <div class="scan-line"></div>
      </div>
      <input class="inp" id="scanInput" placeholder="Guía manual" onkeypress="if(event.key==='Enter'){handleScan(this.value);this.value='';}">
      <div id="scanRes" style="margin-top:14px"></div>
    </div>
  `;
  initScan(handleScan);
}

async function handleScan(g){
  const res=document.getElementById('scanRes');
  res.innerHTML=`<div class="scan-result" style="background:var(--bg);color:var(--tx2)">✓ ${esc(g)}</div>`;
}

function renderBuscar(){
  document.getElementById('pg').innerHTML=`<p style="padding:20px">Buscar (en desarrollo)</p>`;
}

function renderMenu(){
  document.getElementById('pg').innerHTML=`
    <div style="padding:14px 0">
      <div class="card" onclick="pgLogout()">
        <div class="card-row">
          <div class="ci" style="background:var(--red);color:#fff">↪</div>
          <div style="flex:1">
            <div class="ct">Cerrar sesión</div>
            <div class="cs">${esc(S.profile?.email||'')}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

async function pgLogout(){
  await sb.auth.signOut();
  S.user=null;
  S.profile=null;
  go('login',false);
}

async function initScan(callback){
  S.scanCb=callback;
  try{
    const vid=document.getElementById('scanVid');
    if(!vid)return;
    S.scanStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}}
    });
    vid.srcObject=S.scanStream;
    await vid.play();
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['code_128','ean_13','ean_8','code_39']});
      let lastCode=null,lastTime=0,locked=false;
      const COOLDOWN=1500;
      const loop=async()=>{
        if(!S.scanStream)return;
        const now=Date.now();
        if(!locked&&(now-lastTime)>=COOLDOWN){
          try{
            const codes=await det.detect(vid);
            if(codes.length){
              const g=codes[0].rawValue;
              if(g&&(g!==lastCode||(now-lastTime)>=COOLDOWN*2)){
                lastCode=g;
                lastTime=now;
                locked=true;
                const line=document.querySelector('.scan-line');
                if(line){
                  line.style.background='var(--grn)';
                  line.style.boxShadow='0 0 8px var(--grn)';
                }
                if(S.scanCb)await S.scanCb(g);
                setTimeout(()=>{
                  const l=document.querySelector('.scan-line');
                  if(l){
                    l.style.background='var(--red)';
                    l.style.boxShadow='0 0 8px var(--red)';
                  }
                  locked=false;
                },COOLDOWN);
              }
            }
          }catch(e){}
        }
        if(S.scanStream)setTimeout(()=>requestAnimationFrame(loop),100);
      };
      requestAnimationFrame(loop);
    }else{
      const area=document.getElementById('scanArea');
      if(area)area.innerHTML+='<div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);padding:8px;text-align:center;font-size:var(--fss);color:var(--amb)">Usa el campo de texto</div>';
    }
  }catch(e){
    const area=document.getElementById('scanArea');
    if(area)area.innerHTML='<div style="padding:20px;text-align:center;color:var(--tx3)">Cámara no disponible</div>';
  }
}

function stopScan(){
  if(S.scanStream){
    S.scanStream.getTracks().forEach(t=>t.stop());
    S.scanStream=null;
  }
  S.scanCb=null;
}

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(session){
    S.user=session.user;
    const{data:prof}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
    S.profile=prof;
    if(prof&&prof.activo){
      document.getElementById('mainNav').style.display='flex';
      go('home',false);
      return;
    }
  }
  go('login',false);
}

init();
</script>
</body>
</html>
