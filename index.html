<style>
:root{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
  --brd:#334155;--brd2:#475569;
  --tx:#f1f5f9;--tx2:#94a3b8;--tx3:#64748b;
  --acc:#3b82f6;--grn:#10b981;--red:#ef4444;--amb:#f59e0b;--pur:#8b5cf6;
  --fn:'DM Sans',sans-serif;--mo:'DM Mono',monospace;
  --r:14px;--r2:10px;
  --fs:clamp(14px,3.8vw,16px);--fsm:clamp(12px,3.2vw,14px);--fss:clamp(11px,2.8vw,12px);
  --h:clamp(44px,12vw,52px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;touch-action:manipulation}
body{background:var(--bg);color:var(--tx);font-family:var(--fn);font-size:var(--fs);height:100%;display:flex;flex-direction:column;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}
.bar{background:var(--bg2);border-bottom:1px solid var(--brd);padding:0 14px;display:flex;align-items:center;gap:10px;height:var(--h);flex-shrink:0}
.bar-back{width:34px;height:34px;border-radius:8px;border:1px solid var(--brd2);background:none;color:var(--tx);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.bar-back.vis{display:flex}
.bar-title{font-size:clamp(14px,4vw,16px);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sub{font-size:var(--fss);color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.pg{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.nav{background:var(--bg2);border-top:1px solid var(--brd);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;padding:9px 2px;border:none;background:none;color:var(--tx3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--fss);font-family:var(--fn);min-height:var(--h)}
.nb.on{color:var(--acc)}
.nb svg{width:22px;height:22px}
.card{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:background .15s}
.card:active{background:var(--bg3)}
.card-row{display:flex;align-items:center;gap:12px}
.ci{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ct{font-weight:500;font-size:var(--fsm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{font-size:var(--fss);color:var(--tx2);margin-top:2px}
.b{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:var(--fss);font-weight:500;font-family:var(--mo);white-space:nowrap}
.b-bl{background:rgba(59,130,246,.15);color:#93c5fd}
.b-gr{background:rgba(16,185,129,.15);color:#6ee7b7}
.b-am{background:rgba(245,158,11,.15);color:#fcd34d}
.b-rd{background:rgba(239,68,68,.15);color:#fca5a5}
.b-pu{background:rgba(139,92,246,.15);color:#c4b5fd}
.b-gy{background:rgba(100,116,139,.15);color:var(--tx2)}
.btn{font-family:var(--fn);font-size:var(--fsm);font-weight:600;border:none;border-radius:var(--r2);padding:0 18px;height:42px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--acc);color:#fff}
.btn-g{background:var(--grn);color:#fff}
.btn-d{background:var(--red);color:#fff}
.btn-o{background:transparent;border:1px solid var(--brd2);color:var(--tx)}
.btn-w{width:100%}
.btn-s{height:36px;font-size:var(--fss);padding:0 12px}
.btn:disabled{opacity:.4;pointer-events:none}
.inp{font-family:var(--fn);font-size:var(--fsm);background:var(--bg);border:1px solid var(--brd2);color:var(--tx);border-radius:var(--r2);padding:0 14px;height:42px;width:100%;outline:none;transition:border .2s}
.inp:focus{border-color:var(--acc)}
.sel{appearance:none;background:var(--bg) url("data:image/svg+xml,%3Csvg viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%2394a3b8' fill='none' stroke-width='1.5'/%3E%3C/svg%3E") no-repeat right 12px center/10px;padding-right:32px}
label{display:block;font-size:var(--fss);color:var(--tx2);margin-bottom:5px;font-weight:500}
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.dlg-bg.open{display:flex}
.dlg{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:20px;max-width:380px;width:100%;max-height:80vh;overflow-y:auto}
.dlg-t{font-size:var(--fs);font-weight:600;margin-bottom:8px}
.dlg-m{font-size:var(--fsm);color:var(--tx2);margin-bottom:14px}
.dlg-g{font-family:var(--mo);font-size:var(--fss);color:var(--tx3);margin-bottom:14px;word-break:break-all}
.dlg-a{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;bottom:calc(var(--h) + env(safe-area-inset-bottom) + 14px);left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r2);padding:10px 18px;font-size:var(--fsm);font-weight:500;z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.ok{border-color:var(--grn);color:var(--grn)}
#toast.er{border-color:var(--red);color:var(--red)}
#toast.wa{border-color:var(--amb);color:var(--amb)}
#toast.show{opacity:1}
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px;gap:12px}
.sp{width:28px;height:28px;border:3px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--tx3);padding:30px 10px;font-size:var(--fsm)}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stat{flex:1;min-width:72px;background:var(--bg);border:1px solid var(--brd);border-radius:var(--r2);padding:10px;text-align:center}
.stat-n{font-size:clamp(18px,5vw,24px);font-weight:700;font-family:var(--mo)}
.stat-l{font-size:var(--fss);color:var(--tx2);margin-top:2px}
.progress{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin:8px 0}
.progress-bar{height:100%;background:var(--acc);border-radius:3px;transition:width .4s}
.scan-area{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;max-height:42vh}
.scan-area video{width:100%;height:100%;object-fit:cover}
.scan-line{position:absolute;top:50%;left:10%;right:10%;height:2px;background:var(--red);box-shadow:0 0 8px var(--red);animation:scanmove 2s ease-in-out infinite;transition:background .2s,box-shadow .2s}
@keyframes scanmove{0%,100%{top:30%}50%{top:70%}}
.scan-result{padding:7px 12px;border-radius:var(--r2);margin-bottom:5px;font-family:var(--mo);font-size:var(--fss);display:flex;align-items:center;gap:8px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.file-drop{border:2px dashed var(--brd2);border-radius:var(--r);padding:28px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.file-drop:hover,.file-drop.drag{border-color:var(--acc);background:rgba(59,130,246,.05)}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fss)}
.tbl th{text-align:left;padding:7px 8px;color:var(--tx2);border-bottom:1px solid var(--brd);font-weight:500;white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--brd);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.seg{display:flex;background:var(--bg);border:1px solid var(--brd);border-radius:var(--r2);padding:3px;gap:3px;margin-bottom:14px}
.seg-btn{flex:1;padding:7px 4px;border:none;background:none;color:var(--tx2);border-radius:8px;cursor:pointer;font-size:var(--fss);font-family:var(--fn);font-weight:500;transition:background .15s,color .15s;white-space:nowrap}
.seg-btn.on{background:var(--bg2);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sec-title{font-size:var(--fsm);font-weight:600;color:var(--tx2);margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-family:var(--mo);font-weight:600;background:rgba(59,130,246,.12);color:var(--acc)}
</style>
</head>

<script>
const SUPABASE_URL='https://vqdepoedhhhggqzmazie.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxZGVwb2VkaGhoZ2dxem1hemllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0OTM4MzIsImV4cCI6MjA5MzA2OTgzMn0.B5kuBgcIHFnrFCMAD96VwIb6cbTu5eOZVdYhDrLMeV8';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// ── Clave maestra de encriptación (cambia esto por una clave segura tuya) ──
// Esta clave NUNCA se guarda en la BD — solo existe en el código
const MASTER_KEY='STC-Express-2026-MasterKey#Suba!';

// ── Utilidades AES-256-GCM ──
async function getAesKey(){
  const enc=new TextEncoder();
  const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(MASTER_KEY),{name:'PBKDF2'},false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:enc.encode('stc-salt-v1'),iterations:100000,hash:'SHA-256'},
    keyMaterial,{name:'AES-GCM',length:256},false,['encrypt','decrypt']
  );
}

async function encryptText(plain){
  if(!plain)return null;
  const key=await getAesKey();
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const enc=new TextEncoder();
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(plain));
  // Combinar iv + cifrado en base64
  const combined=new Uint8Array(iv.byteLength+cipher.byteLength);
  combined.set(iv,0);combined.set(new Uint8Array(cipher),iv.byteLength);
  return btoa(String.fromCharCode(...combined));
}

async function decryptText(b64){
  if(!b64)return null;
  try{
    const key=await getAesKey();
    const combined=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const iv=combined.slice(0,12);
    const cipher=combined.slice(12);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,cipher);
    return new TextDecoder().decode(plain);
  }catch(e){return null;}
}

const S={
  user:null,profile:null,stack:[],
  mensajeros:[],
  asigMensId:null,asigMensTipo:null,asigMensNombre:null,asigLista:[],
  scanCb:null,scanStream:null,
  homeFecha:null,
  // nav context
  _contId:null,_contCodigo:null,
  _mensId:null,_mensNombre:null,
  _auditMensId:null,_auditMensNombre:null,
};
const nm={home:0,contenedores:1,asignar:2,buscar:3,'zona-menu':-1};
const nmMain={'home':1,'contenedores':3,'asignar':2,'buscar':4,'zona-menu':0};
const nmNomina={'nomina-home':1,'nomina-liquidar':2,'nomina-descuentos':3,'zona-menu':0};
const nmUsuarios={'usuarios':1,'usuario-detalle':1,'usuario-nuevo':2,'zona-menu':0};

// Páginas que pertenecen a cada zona
const ZONA_PAQUETERIA=['home','contenedores','cont-detalle','cont-mensajero','importar','asignar','asignar-scan','asignar-lista','buscar','mensajeros','mens-gestionar','mens-historial','mens-paquetes'];
const ZONA_NOMINA=['nomina-home','nomina-liquidar','nomina-descuentos','nomina-desc-individual','nomina-desc-grupal','ver-recibo','quincena-detalle','quincena-mensajero-recibo'];
const ZONA_USUARIOS=['usuarios','usuario-detalle','usuario-nuevo'];

function setNavZona(page){
  const mainNav=document.getElementById('mainNav');
  const nominaNav=document.getElementById('nominaNav');
  const usuariosNav=document.getElementById('usuariosNav');
  mainNav.style.display='none';
  nominaNav.style.display='none';
  usuariosNav.style.display='none';
  if(page==='zona-menu'||page==='login') return;
  if(ZONA_USUARIOS.includes(page)){
    usuariosNav.style.display='flex';
    document.querySelectorAll('#usuariosNav .nb').forEach((b,i)=>b.classList.toggle('on',i===(nmUsuarios[page]??-1)));
  } else if(ZONA_NOMINA.includes(page)){
    nominaNav.style.display='flex';
    document.querySelectorAll('#nominaNav .nb').forEach((b,i)=>b.classList.toggle('on',i===(nmNomina[page]??-1)));
  } else {
    mainNav.style.display='flex';
    document.querySelectorAll('#mainNav .nb').forEach((b,i)=>b.classList.toggle('on',i===(nmMain[page]??-1)));
  }
}
const stColor={pendiente:'b-am',verificado:'b-bl',asignado:'b-pu',en_ruta:'b-gr',entregado:'b-gr',devuelto:'b-rd',sobrante:'b-rd',fuera_zona:'b-gy'};

// ── Audio ──
let _ac=null;
function getAC(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function beep(type){
  try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
    if(type==='ok'){o.frequency.value=880;g.gain.value=.12;o.start();o.stop(ac.currentTime+.12);}
    else if(type==='er'){o.frequency.value=280;g.gain.value=.15;o.start();o.stop(ac.currentTime+.25);}
    else if(type==='wa'){o.frequency.value=660;g.gain.value=.1;o.start();o.stop(ac.currentTime+.08);setTimeout(()=>{const o2=ac.createOscillator(),g2=ac.createGain();o2.connect(g2);g2.connect(ac.destination);o2.frequency.value=580;g2.gain.value=.1;o2.start();o2.stop(ac.currentTime+.12);},130);}
  }catch(e){}
}

// ── Router ──
async function go(page,push=true){
  stopScan();
  if(push&&page!=='home'&&page!=='nomina-home')S.stack.push(page);
  if(page==='home'||page==='nomina-home'||page==='zona-menu')S.stack=[];
  setNavZona(page);
  document.getElementById('btnBack').classList.toggle('vis',S.stack.length>0&&page!=='home'&&page!=='nomina-home'&&page!=='zona-menu');
  document.getElementById('barRight').innerHTML='';
  try{
    switch(page){
      case 'home':               await pgHome();break;
      case 'login':              pgLogin();break;
      case 'zona-menu':          pgZonaMenu();break;
      case 'contenedores':       await pgContenedores();break;
      case 'cont-detalle':       await pgContDetalle();break;
      case 'cont-mensajero':     await pgContMensajero();break;
      case 'importar':           pgImportar();break;
      case 'asignar':            await pgAsignar();break;
      case 'asignar-scan':       pgAsignarScan();break;
      case 'asignar-lista':      pgAsignarLista();break;
      case 'buscar':             pgBuscar();break;
      case 'mensajeros':         await pgMensajeros();break;
      case 'mens-gestionar':     await pgMensGestionar();break;
      case 'mens-historial':     await pgMensHistorial();break;
      case 'mens-paquetes':      await pgMensPaquetes();break;
      // ── Nómina ──
      case 'nomina-home':        await pgNominaHome();break;
      case 'nomina-liquidar':    await pgNominaLiquidar();break;
      case 'nomina-descuentos':  await pgNominaDescuentos();break;
      case 'nomina-desc-individual': await pgDescIndividual();break;
      case 'nomina-desc-grupal': await pgDescGrupal();break;
      case 'ver-recibo':         await verReciboGuardado(S._verReciboId);break;
      case 'quincena-detalle':   await pgQuincenaDetalle();break;
      case 'quincena-mensajero-recibo': await pgQuinMensajeroRecibo();break;
      // ── Usuarios ──
      case 'usuarios':           await pgUsuarios();break;
      case 'usuario-detalle':    await pgUsuarioDetalle();break;
      case 'usuario-nuevo':      await pgUsuarioNuevo();break;
      default:                   await pgHome();
    }
  }catch(e){
    console.error('go() error en página',page,e);
    document.querySelectorAll('.nav .nb').forEach(b=>b.disabled=false);
    setP(`<div class="ld"><p style="color:var(--red);text-align:center">${esc(e.message)}<br><br><button class="btn btn-o btn-s" onclick="go('home',false)">← Volver al inicio</button></p></div>`);
  }
}
function goBack(){S.stack.pop();const p=S.stack[S.stack.length-1]||'home';S.stack.pop();go(p);}

// ── UI helpers ──
function setBar(t,s=''){document.getElementById('pgT').textContent=t;document.getElementById('pgS').textContent=s;}
function setP(h){document.getElementById('pg').innerHTML=h;}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,type='ok'){beep(type);const e=document.getElementById('toast');e.textContent=msg;e.className=type+' show';clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2800);}
function loader(){return '<div class="ld"><div class="sp"></div></div>';}
function cleanGuia(raw){
  const s=String(raw||'').trim().replace(/[^0-9]/g,'');
  // Formato estándar: 16 dígitos empezando con "26"
  if(s.length===16&&s.startsWith('26')) return s;
  // Sobrantes u otros formatos: aceptar cualquier número >= 8 dígitos
  if(s.length>=8) return s;
  return null;
}
function todayISO(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){if(!d)return'—';try{return new Date(d+'T12:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;}}
function fmtDateTime(d){if(!d)return'—';try{const dt=new Date(d);return dt.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})+' '+dt.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});}catch(e){return d;}}
function fmtTime(d){if(!d)return'—';try{return new Date(d).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});}catch(e){return d;}}

function dialog(title,msg,guia,acts){
  document.getElementById('dlgT').textContent=title;
  document.getElementById('dlgM').textContent=msg;
  const gEl=document.getElementById('dlgG');gEl.textContent=guia||'';gEl.style.display=guia?'block':'none';
  const aEl=document.getElementById('dlgA');aEl.innerHTML='';
  acts.forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.c||'btn-o')+' btn-s';b.textContent=a.l;b.onclick=a.fn;aEl.appendChild(b);});
  document.getElementById('dlg').classList.add('open');
}
function closeDlg(){document.getElementById('dlg').classList.remove('open');}

      <button class="btn btn-p btn-w" onclick="doLogin()" id="loginBtn">Iniciar sesión</button>
    </div>
    <p id="loginErr" style="color:var(--red);font-size:var(--fss);margin-top:12px;display:none"></p>
  </div>`);
}
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  if(!email||!pass){errEl.textContent='Completa ambos campos';errEl.style.display='block';return;}
  btn.disabled=true;btn.textContent='Cargando...';errEl.style.display='none';
  try{
    const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error)throw error;
    S.user=data.user;
    const{data:prof}=await sb.from('profiles').select('*').eq('id',data.user.id).single();
    S.profile=prof;
    if(!prof||!prof.activo)throw new Error('Usuario no activo');
    document.getElementById('mainNav').style.display='flex';
    toast('Bienvenido, '+prof.nombre_completo,'ok');
    go('zona-menu',false);
  }catch(e){
    errEl.textContent=e.message||'Error de autenticación';
    errEl.style.display='block';
    btn.disabled=false;btn.textContent='Iniciar sesión';
  }
}

// HOME — Dashboard Hoy (con fecha seleccionable)
// ══════════════════════════════════════════════════════════════════
async function pgHome(){
  if(!S.user){go('login',false);return;}
  if(!S.homeFecha)S.homeFecha=todayISO();
  setBar('STC Express',S.profile?.nombre_completo||'');
  setP(loader());

  const hoy=todayISO();
  const _ayer=new Date();_ayer.setDate(_ayer.getDate()-1);
  const ayer=_ayer.getFullYear()+'-'+String(_ayer.getMonth()+1).padStart(2,'0')+'-'+String(_ayer.getDate()).padStart(2,'0');
  const diaStart=S.homeFecha+'T00:00:00';
  const diaEnd=S.homeFecha+'T23:59:59';
  const fechaLabel=S.homeFecha===hoy?'hoy':S.homeFecha===ayer?'ayer':fmtDate(S.homeFecha);

  // Pendientes del DÍA seleccionado: paquetes importados ese día sin mensajero
  // Rezagados: paquetes de días ANTERIORES sin mensajero (importados antes del día seleccionado)
  const[
    {data:asignadosHoy},
    {count:totalEntr},
    {count:totalDev},
    {count:totalPendDia},
    {count:totalRezagados},
    {count:totalAsigCount},
    {data:actividadMens},
  ]=await Promise.all([
    // Asignados hoy — datos para listar por mensajero
    sb.from('historial_paquetes')
      .select('paquete_id,mensajero_nuevo,mensajero_simple_nuevo,realizado_en,paquetes(num_guia,destinatario,direccion_original,estado,zonas(nombre)),profiles!mensajero_nuevo(nombre_completo),mensajeros!mensajero_simple_nuevo(nombre_completo)')
      .in('accion',['asignado','reasignado'])
      .gte('realizado_en',diaStart).lte('realizado_en',diaEnd)
      .limit(2000),
    // Entregados hoy — estado real en paquetes
    sb.from('paquetes')
      .select('id',{count:'exact',head:true})
      .eq('estado','entregado')
      .gte('updated_at',diaStart).lte('updated_at',diaEnd),
    // Devueltos hoy — estado real en paquetes
    sb.from('paquetes')
      .select('id',{count:'exact',head:true})
      .eq('estado','devuelto')
      .gte('updated_at',diaStart).lte('updated_at',diaEnd),
    // Pendientes del día sin asignar
    sb.from('paquetes')
      .select('id',{count:'exact',head:true})
      .in('estado',['pendiente','verificado'])
      .is('mensajero_id',null).is('mensajero_simple_id',null)
      .gte('created_at',diaStart).lte('created_at',diaEnd),
    // Rezagados de días anteriores sin asignar
    sb.from('paquetes')
      .select('id',{count:'exact',head:true})
      .in('estado',['pendiente','verificado'])
      .is('mensajero_id',null).is('mensajero_simple_id',null)
      .lt('created_at',diaStart),
    // Paquetes con mensajero asignado hoy (estado actual = asignado/en_ruta)
    sb.from('paquetes')
      .select('id',{count:'exact',head:true})
      .in('estado',['asignado','en_ruta'])
      .gte('updated_at',diaStart).lte('updated_at',diaEnd),
    // Actividad completa por mensajero hoy (todas las acciones)
    sb.from('historial_paquetes')
      .select('paquete_id,accion,mensajero_nuevo,mensajero_simple_nuevo,realizado_en,profiles!mensajero_nuevo(nombre_completo),mensajeros!mensajero_simple_nuevo(nombre_completo)')
      .in('accion',['asignado','reasignado','entregado','devuelto_bodega','desasignado'])
      .gte('realizado_en',diaStart).lte('realizado_en',diaEnd)
      .limit(3000),
  ]);

  const totalAsig=totalAsigCount??0;

  // ── Actividad completa por mensajero ──
  // Para cada mensajero: cuántos asignó, entregó, devolvió, intercambió
  const actMens={};
  const addAct=(mId,mNombre,campo)=>{
    if(!mId||mId==='sin')return;
    if(!actMens[mId])actMens[mId]={nombre:mNombre,asignados:0,entregados:0,devueltos:0,intercambiados:0};
    actMens[mId][campo]++;
  };
  (actividadMens||[]).forEach(r=>{
    const mId=r.mensajero_simple_nuevo||r.mensajero_nuevo;
    if(!mId)return;
    const perfilProf=Array.isArray(r.profiles)?r.profiles[0]:r.profiles;
    const perfilMens=Array.isArray(r.mensajeros)?r.mensajeros[0]:r.mensajeros;
    const mNombre=perfilMens?.nombre_completo||perfilProf?.nombre_completo||'Mensajero';
    if(r.accion==='asignado') addAct(mId,mNombre,'asignados');
    else if(r.accion==='reasignado') addAct(mId,mNombre,'intercambiados');
    else if(r.accion==='entregado') addAct(mId,mNombre,'entregados');
    else if(r.accion==='devuelto_bodega') addAct(mId,mNombre,'devueltos');
  });

  // Deduplicar asignados: solo la entrada más reciente por paquete
  const paqUltimo={};
  (asignadosHoy||[]).forEach(r=>{
    const pid=r.paquete_id;
    if(!paqUltimo[pid]||r.realizado_en>paqUltimo[pid].realizado_en) paqUltimo[pid]=r;
  });

  // Agrupar para tarjetas — excluir paquetes devueltos o entregados
  const porMens={};
  Object.values(paqUltimo).forEach(r=>{
    const estadoActual=r.paquetes?.estado;
    if(['devuelto','entregado'].includes(estadoActual)) return;
    const mId=r.mensajero_simple_nuevo||r.mensajero_nuevo||'sin';
    const perfilProf=Array.isArray(r.profiles)?r.profiles[0]:r.profiles;
    const perfilMens=Array.isArray(r.mensajeros)?r.mensajeros[0]:r.mensajeros;
    const mNombre=perfilMens?.nombre_completo||perfilProf?.nombre_completo||(mId==='sin'?'Sin asignar':null)||'Mensajero '+mId.slice(0,6);
    if(!porMens[mId]){porMens[mId]={nombre:mNombre,count:0,paquetes:[]};}
    porMens[mId].count++;
    if(r.paquetes) porMens[mId].paquetes.push({
      guia:r.paquetes.num_guia,destinatario:r.paquetes.destinatario,
      direccion:r.paquetes.direccion_original,estado:estadoActual,
      zona:r.paquetes.zonas?.nombre||'—',
    });
  });

  let h=`
    <div class="seg">
      <button class="seg-btn ${S.homeFecha===hoy?'on':''}" onclick="S.homeFecha='${hoy}';pgHome()">Hoy</button>
      <button class="seg-btn ${S.homeFecha===ayer?'on':''}" onclick="S.homeFecha='${ayer}';pgHome()">Ayer</button>
      <button class="seg-btn ${S.homeFecha!==hoy&&S.homeFecha!==ayer?'on':''}" onclick="pickFechaHome()">
        ${S.homeFecha!==hoy&&S.homeFecha!==ayer?'📅 '+fmtDate(S.homeFecha):'📅 Fecha'}
      </button>
    </div>

    <div class="stat-row">
      <div class="stat">
        <div class="stat-n" style="color:var(--red)">${totalPendDia}</div>
        <div class="stat-l">Pendientes<br>${fechaLabel}</div>
      </div>
      <div class="stat">
        <div class="stat-n" style="color:var(--acc)">${totalAsig}</div>
        <div class="stat-l">Asignados<br>${fechaLabel}</div>
      </div>
      <div class="stat">
        <div class="stat-n" style="color:var(--grn)">${totalEntr}</div>
        <div class="stat-l">Entregados<br>${fechaLabel}</div>
      </div>
      <div class="stat">
        <div class="stat-n" style="color:var(--amb)">${totalDev}</div>
        <div class="stat-l">Devueltos<br>${fechaLabel}</div>
      </div>
    </div>
  `;

  // Accesos rápidos siempre visibles
  h += `<div style="display:flex;gap:8px;margin-bottom:14px">
    <button class="btn btn-o btn-s" style="flex:1" onclick="go('buscar')">🔍 Buscar guía</button>
  </div>`;

  // Alerta pendientes del día
  if(totalPendDia>0){
    h+=`<div style="background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.25);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div>
        <div style="font-weight:600;color:var(--red);font-size:var(--fsm)">${totalPendDia} sin asignar ${fechaLabel}</div>
        <div style="font-size:var(--fss);color:var(--tx2);margin-top:2px">Importados este día, sin mensajero</div>
      </div>
      <button class="btn btn-d btn-s" onclick="go('asignar')">Asignar →</button>
    </div>`;
  }
  // Alerta rezagados (días anteriores)
  if(totalRezagados>0){
    h+=`<div style="background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.25);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div>
        <div style="font-weight:600;color:var(--amb);font-size:var(--fsm)">${totalRezagados} rezagados de días anteriores</div>
        <div style="font-size:var(--fss);color:var(--tx2);margin-top:2px">Paquetes de contenedores previos sin asignar</div>
      </div>
      <button class="btn btn-s" style="background:var(--amb);color:#000;font-weight:600" onclick="go('asignar')">Asignar →</button>
    </div>`;
  }

  if(totalAsig===0){
    h+=`<p class="empty">Sin asignaciones ${fechaLabel}</p>`;
  } else {
    h+=`<div class="sec-title">Mensajeros · ${fechaLabel}</div>`;
    // Guardar datos en window para acceso desde el detalle
    window._homePorMens=porMens;
    window._homeFechaLabel=fechaLabel;
    Object.entries(porMens).sort((a,b)=>b[1].count-a[1].count).forEach(([mId,m])=>{
      const essinasignar=mId==='sin';
      const act=actMens[mId]||{};
      const chips=[];
      if(act.asignados) chips.push(`<span style="color:var(--acc)">${act.asignados} asig</span>`);
      if(act.entregados) chips.push(`<span style="color:var(--grn)">${act.entregados} entr</span>`);
      if(act.devueltos) chips.push(`<span style="color:var(--red)">${act.devueltos} dev</span>`);
      if(act.intercambiados) chips.push(`<span style="color:var(--amb)">${act.intercambiados} intercamb</span>`);
      h+=`<div class="card" onclick="mostrarDetalleMensHome('${esc(mId)}')">
        <div class="card-row">
          <div class="ci" style="background:${essinasignar?'rgba(239,68,68,.12)':'rgba(139,92,246,.12)'};color:${essinasignar?'var(--red)':'var(--pur)'}">
            ${essinasignar?'⚠':'👤'}
          </div>
          <div style="flex:1;min-width:0">
            <div class="ct" style="${essinasignar?'color:var(--red)':''}">${esc(m.nombre)}</div>
            <div class="cs">${m.count} paquete${m.count!==1?'s':''} en curso ${fechaLabel}</div>
            ${chips.length?`<div style="font-size:var(--fss);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap">${chips.join('')}</div>`:''}
          </div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;color:var(--tx3)"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>`;
    });
  }
  setP(h);
}

function mostrarDetalleMensHome(mId){
  const m=window._homePorMens?.[mId];
  if(!m)return;
  const paquetes=m.paquetes||[];
  let h=`
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px">
      <div class="sec-title" style="margin:0">${esc(m.nombre)} · ${m.count} paquete${m.count!==1?'s':''}</div>
      ${paquetes.length?`<button class="btn btn-p btn-s" onclick="descargarGuiasMensajero('${esc(mId)}')">⬇ PDF guías</button>`:''}
    </div>`;
  if(!paquetes.length){
    h+=`<p class="empty">Sin paquetes en curso</p>`;
  } else {
    paquetes.forEach(p=>{
      const estadoColor={asignado:'var(--acc)',en_ruta:'var(--amb)',entregado:'var(--grn)',devuelto:'var(--red)'}[p.estado]||'var(--tx3)';
      h+=`<div class="card" style="cursor:default">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
          <div style="min-width:0">
            <div style="font-family:var(--mo);font-size:var(--fsm);color:var(--acc)">${esc(p.guia||'—')}</div>
            <div style="font-weight:500;margin-top:2px">${esc(p.destinatario||'—')}</div>
            <div style="font-size:var(--fss);color:var(--tx3);margin-top:1px">${esc(p.direccion||'—')}</div>
          </div>
          <div style="flex-shrink:0;text-align:right">
            <span class="chip">${esc(p.zona)}</span>
            <div style="font-size:var(--fss);color:${estadoColor};margin-top:4px;text-transform:capitalize">${esc(p.estado)}</div>
          </div>
        </div>
      </div>`;
    });
  }
  h+=`<button class="btn btn-o btn-w btn-s" style="margin-top:8px" onclick="pgHome()">← Volver</button>`;
  setP(h);
}

function descargarGuiasMensajero(mId){
  const m=window._homePorMens?.[mId];
  if(!m||!m.paquetes?.length){toast('Sin paquetes para exportar','wa');return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const PW=210,ML=14,MR=14,CW=PW-ML-MR;
  let y=14;

  // ── Colores ──
  const DARK=[15,23,42],GRAY=[100,116,139],LIGHT=[241,245,249],BLUE=[59,130,246],WHITE=[255,255,255],GREEN=[16,185,129];

  // ── Encabezado ──
  doc.setFillColor(...DARK);
  doc.rect(0,0,PW,32,'F');

  // Logo/nombre empresa
  doc.setFontSize(18);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
  doc.text('STC Express',ML,y+11);

  // Subtítulo debajo del nombre
  doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(148,163,184);
  doc.text('Lista de guías asignadas',ML,y+19);

  // Fecha arriba a la derecha
  const fecha=new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'});
  doc.setFontSize(8);doc.setTextColor(148,163,184);
  doc.text(fecha,PW-MR,y+11,{align:'right'});

  // Badge nombre mensajero debajo de la fecha — sin cortar
  doc.setFillColor(...BLUE);
  const badgeW=Math.min(CW*0.5, 90);
  doc.roundedRect(PW-MR-badgeW,y+14,badgeW,11,2,2,'F');
  doc.setFontSize(7.5);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
  // Truncar solo si es muy largo
  const nombreBadge=m.nombre.length>35?m.nombre.slice(0,34)+'…':m.nombre;
  doc.text(nombreBadge,PW-MR-badgeW/2,y+21,{align:'center'});

  y=38;

  // ── Resumen ──
  doc.setFillColor(...LIGHT);
  doc.roundedRect(ML,y,CW,12,2,2,'F');
  doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(...DARK);
  doc.text(`Total de paquetes: ${m.paquetes.length}`,ML+4,y+8);
  doc.setFont('helvetica','normal');doc.setTextColor(...GRAY);
  doc.text(`Generado: ${fecha}`,PW-MR-4,y+8,{align:'right'});
  y+=18;

  // ── Cabecera tabla ──
  doc.setFillColor(...DARK);
  doc.rect(ML,y,CW,7,'F');
  doc.setFontSize(7);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
  doc.text('#',ML+2,y+4.8);
  doc.text('Guía',ML+10,y+4.8);
  doc.text('Destinatario',ML+70,y+4.8);
  doc.text('Zona',PW-MR-2,y+4.8,{align:'right'});
  y+=7;

  // ── Filas ──
  const paqOrdenados=[...m.paquetes].sort((a,b)=>(a.zona||'').localeCompare(b.zona||''));
  paqOrdenados.forEach((p,i)=>{
    // Nueva página si hace falta
    if(y>270){
      doc.addPage();
      y=14;
      // Repite cabecera tabla
      doc.setFillColor(...DARK);
      doc.rect(ML,y,CW,7,'F');
      doc.setFontSize(7);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
      doc.text('#',ML+2,y+4.8);
      doc.text('Guía',ML+10,y+4.8);
      doc.text('Destinatario',ML+70,y+4.8);
      doc.text('Zona',PW-MR-2,y+4.8,{align:'right'});
      y+=7;
    }

    const bg=i%2===0?WHITE:[248,250,252];
    doc.setFillColor(...bg);
    doc.rect(ML,y,CW,7,'F');
    doc.setDrawColor(...LIGHT);doc.setLineWidth(0.2);
    doc.line(ML,y+7,PW-MR,y+7);

    doc.setFontSize(7);doc.setFont('helvetica','normal');doc.setTextColor(...GRAY);
    doc.text(String(i+1),ML+2,y+4.8);

    doc.setTextColor(...BLUE);doc.setFont('helvetica','bold');
    doc.text(String(p.guia||'—').slice(0,25),ML+10,y+4.8);

    doc.setTextColor(...DARK);doc.setFont('helvetica','normal');
    const dest=String(p.destinatario||'—');
    doc.text(dest.length>32?dest.slice(0,31)+'…':dest,ML+70,y+4.8);

    doc.setTextColor(...GRAY);
    doc.text(String(p.zona||'—').slice(0,12),PW-MR-2,y+4.8,{align:'right'});
    y+=7;
  });

  // ── Total final ──
  y+=2;
  doc.setFillColor(...GREEN);
  doc.roundedRect(ML,y,CW,8,2,2,'F');
  doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
  doc.text(`Total: ${m.paquetes.length} paquetes asignados`,ML+CW/2,y+5.5,{align:'center'});

  // ── Pie ──
  const yFoot=295;
  doc.setDrawColor(...LIGHT);doc.setLineWidth(0.3);doc.line(ML,yFoot-4,PW-MR,yFoot-4);
  doc.setFontSize(6);doc.setFont('helvetica','normal');doc.setTextColor(...GRAY);
  doc.text('STC Express Mensajería · Suba, Bogotá',ML,yFoot);
  doc.text(`${m.nombre} · ${fecha}`,PW-MR,yFoot,{align:'right'});

  // ── Descargar ──
  const nombreLimpio=m.nombre.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
  const hoy=new Date();
  const fechaArchivo=`${hoy.getFullYear()}${String(hoy.getMonth()+1).padStart(2,'0')}${String(hoy.getDate()).padStart(2,'0')}`;
  doc.save(`Guias_${nombreLimpio}_${fechaArchivo}.pdf`);
  toast('PDF generado ✓','ok');
}

async function pgMensHistorial(){

  if(!mId){goBack();return;}

  const diaEnd=fecha+'T23:59:59';

  const{data:eventos}=await sb.from('historial_paquetes')

async function eliminarContenedor(contId, codigo){
  // Verificar cuántos paquetes tiene
  const{count:numPaq}=await sb.from('paquetes')
    .select('id',{count:'exact',head:true})
    .eq('contenedor_id',contId);

  const msg=numPaq>0
    ? `¿Eliminar el contenedor ${codigo} y sus ${numPaq} paquetes?\n\nEsto también eliminará el historial asociado.`
    : `¿Eliminar el contenedor ${codigo}?\n\nNo tiene paquetes asociados.`;

  dialog('Eliminar contenedor', msg,'',
    [
      {l:'Cancelar',fn:closeDlg},
      {l:'Eliminar',c:'btn-d',fn:async()=>{
        closeDlg();
        setP(loader());
        try{
          // Eliminar historial de los paquetes del contenedor
          if(numPaq>0){
            const{data:paqIds}=await sb.from('paquetes').select('id').eq('contenedor_id',contId);
            if(paqIds?.length){
              await sb.from('historial_paquetes')
                .delete()
                .in('paquete_id',paqIds.map(p=>p.id));
            }
            // Eliminar paquetes
            await sb.from('paquetes').delete().eq('contenedor_id',contId);
          }
          // Eliminar contenedor
          const{error}=await sb.from('contenedores').delete().eq('id',contId);
          if(error)throw error;
          toast(`Contenedor ${codigo} eliminado ✓`,'ok');
          pgContenedores();
        }catch(e){
          toast('Error: '+e.message,'er');
          pgContenedores();
        }
      }}
    ]
  );
}

// ── Detalle contenedor con tabs Zonas / Mensajeros ──
async function pgContDetalle(){
  const contId=S._contId;
  const codigo=S._contCodigo||'Contenedor';
  if(!contId){goBack();return;}
  setBar(codigo,'');
  document.getElementById('barRight').innerHTML=`<button class="btn btn-o btn-s" onclick="go('asignar')">Asignar</button>`;
  setP(loader());

  // Conteos exactos con head:true (sin límite de 1000)
  const[
    {count:total},
    {count:cPend},
    {count:cAsig},
    {count:cEntr},
    {count:cDev},
    {data:paq},
  ]=await Promise.all([
    sb.from('paquetes').select('id',{count:'exact',head:true}).eq('contenedor_id',contId),
    sb.from('paquetes').select('id',{count:'exact',head:true}).eq('contenedor_id',contId).in('estado',['pendiente','verificado']).is('mensajero_id',null).is('mensajero_simple_id',null),
    sb.from('paquetes').select('id',{count:'exact',head:true}).eq('contenedor_id',contId).in('estado',['asignado','en_ruta']),
    sb.from('paquetes').select('id',{count:'exact',head:true}).eq('contenedor_id',contId).eq('estado','entregado'),
    sb.from('paquetes').select('id',{count:'exact',head:true}).eq('contenedor_id',contId).eq('estado','devuelto'),
    // Datos para tablas zona/mensajero — traer todos con paginación
    (async()=>{
      let all=[], from=0, batch=1000;
      while(true){
        const{data:chunk}=await sb.from('paquetes')
          .select('id,estado,zona_id,mensajero_id,mensajero_simple_id,zonas(nombre),profiles!mensajero_id(nombre_completo),mensajeros_data:mensajeros!mensajero_simple_id(nombre_completo)')
          .eq('contenedor_id',contId)
          .range(from,from+batch-1);
        if(!chunk?.length)break;
        all=[...all,...chunk];
        if(chunk.length<batch)break;
        from+=batch;
      }
      return{data:all};
    })(),
  ]);

  if(!total){setP('<p class="empty">Sin paquetes</p>');return;}

  const pct=Math.round(100*(cEntr||0)/(total||1));

  // Agrupación por zona
  const byZona={};
  (paq||[]).forEach(p=>{
    const z=p.zonas?.nombre||'Sin zona';
    if(!byZona[z])byZona[z]={total:0,pend:0,asig:0,entr:0,dev:0};
    byZona[z].total++;
    if(['pendiente','verificado'].includes(p.estado)&&!p.mensajero_id&&!p.mensajero_simple_id)byZona[z].pend++;
    else if(['asignado','en_ruta'].includes(p.estado))byZona[z].asig++;
    else if(p.estado==='entregado')byZona[z].entr++;
    else if(p.estado==='devuelto')byZona[z].dev++;
  });

  // Agrupación por mensajero
  const byMens={};
  (paq||[]).forEach(p=>{
    const mId=p.mensajero_simple_id||p.mensajero_id;
    if(!mId)return;
    const mNombre=p.mensajeros_data?.nombre_completo||p.profiles?.nombre_completo||'Sin nombre';
    if(!byMens[mId])byMens[mId]={id:mId,nombre:mNombre,tipo:p.mensajero_simple_id?'mensajero':'profile',total:0,entr:0,dev:0,pend:0};
    byMens[mId].total++;
    if(p.estado==='entregado')byMens[mId].entr++;
    else if(p.estado==='devuelto')byMens[mId].dev++;
    else byMens[mId].pend++;
  });

  const statsHTML=`
    <div class="stat-row">
      <div class="stat"><div class="stat-n">${total}</div><div class="stat-l">Total</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--red)">${cPend}</div><div class="stat-l">Pendientes</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--acc)">${cAsig}</div><div class="stat-l">Asignados</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--grn)">${cEntr}</div><div class="stat-l">Entregados</div></div>
    </div>
    <div class="progress" style="margin-bottom:4px"><div class="progress-bar" style="width:${pct}%;background:var(--grn)"></div></div>
    <div style="text-align:right;font-size:var(--fss);color:var(--tx2);margin-bottom:14px">${pct}% entregado</div>
  `;

  const zonasHTML=()=>{
    let t='<table class="tbl"><tr><th>Zona</th><th>Total</th><th>Pend</th><th>Asig</th><th>Entr</th></tr>';
    Object.entries(byZona).sort((a,b)=>b[1].total-a[1].total).forEach(([z,v])=>{
      t+=`<tr><td><span style="font-size:var(--fss);font-family:var(--mo)">${esc(z)}</span></td>
        <td>${v.total}</td>
        <td style="color:${v.pend?'var(--amb)':'var(--tx3)'}">${v.pend}</td>
        <td style="color:${v.asig?'var(--acc)':'var(--tx3)'}">${v.asig}</td>
        <td style="color:${v.entr?'var(--grn)':'var(--tx3)'}">${v.entr}</td>
      </tr>`;
    });
    return t+'</table>';
  };

  const mensHTML=()=>{
    const entries=Object.values(byMens).sort((a,b)=>b.total-a.total);
    if(!entries.length)return'<p class="empty">Sin asignaciones</p>';
    let t='';
    entries.forEach(m=>{
      t+=`<div class="card" onclick="S._contId='${contId}';S._mensId='${m.id}';S._mensNombre='${esc(m.nombre)}';go('cont-mensajero')">
        <div class="card-row">
          <div class="ci" style="background:rgba(139,92,246,.12);color:var(--pur)">👤</div>
          <div style="flex:1;min-width:0">
            <div class="ct">${esc(m.nombre)}</div>
            <div class="cs">${m.total} paq · ${m.entr} entregados · ${m.dev} devueltos · ${m.pend} pendientes</div>
          </div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;color:var(--tx3)"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>`;
    });
    return t;
  };

  // Renderizar con tabs
  S._contTab = S._contTab || 'zonas';
  // Guardar funciones globalmente para que los botones puedan llamarlas
  window._cdZonasHTML = zonasHTML;
  window._cdMensHTML  = mensHTML;

  setP(statsHTML + `
    <div class="seg" style="margin-bottom:10px">
      <button class="seg-btn ${S._contTab==='zonas'?'on':''}" id="tabZonas"
        onclick="S._contTab='zonas';document.getElementById('tabZonas').classList.add('on');document.getElementById('tabMens').classList.remove('on');document.getElementById('tabContent').innerHTML=window._cdZonasHTML()">Por zona</button>
      <button class="seg-btn ${S._contTab==='mens'?'on':''}" id="tabMens"
        onclick="S._contTab='mens';document.getElementById('tabMens').classList.add('on');document.getElementById('tabZonas').classList.remove('on');document.getElementById('tabContent').innerHTML=window._cdMensHTML()">Por mensajero</button>
    </div>
    <div id="tabContent">${S._contTab==='zonas' ? zonasHTML() : mensHTML()}</div>
  `);
}

    <div class="file-drop" id="fileDrop" onclick="document.getElementById('fileInput').click()"
         ondragover="event.preventDefault();this.classList.add('drag')"
         ondragleave="this.classList.remove('drag')"
         ondrop="event.preventDefault();this.classList.remove('drag');handleFile(event.dataTransfer.files[0])">
      <div style="font-size:36px;margin-bottom:8px">📂</div>
      <p style="font-weight:600;margin-bottom:4px">Selecciona o arrastra el Excel</p>
      <p style="font-size:var(--fss);color:var(--tx3)">Archivo .xlsx del proveedor</p>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this.files[0])">
    <div id="importPreview"></div>
  `);
}
let _importData=null;
async function handleFile(file){
  if(!file)return;
  const prev=document.getElementById('importPreview');
  prev.innerHTML=loader();
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(!rows.length){prev.innerHTML='<p class="empty">Archivo vacío</p>';return;}
    const h=Object.keys(rows[0]);
    const col=k=>h.find(c=>new RegExp(k,'i').test(c));
    const colGuia=col('tracking');
    if(!colGuia){prev.innerHTML='<p style="color:var(--red);margin-top:12px">No se encontró columna "Tracking number"</p>';return;}
    function parseFecha(v){if(!v)return null;const s=String(v).trim();const m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);return null;}
    const contCode=String(rows[0][col('[uú]ltimo\\s*contenedor')]||'CONT_'+todayISO()).trim();
    const paquetes=rows.filter(r=>r[colGuia]).map(r=>({
      guia:String(r[colGuia]).trim(),
      destinatario:String(r[col('^cliente$')]||'Sin nombre').trim(),
      telefono:r[col('tel[eé]fono')]?String(r[col('tel[eé]fono')]).trim():null,
      direccion:String(r[col('direcci[oó]n')]||'').trim(),
      cp:r[col('postal')]?String(r[col('postal')]).trim():null,
      municipio:r[col('^municipio$')]?String(r[col('^municipio$')]).trim():null,
      colonia:r[col('^colonia$')]?String(r[col('^colonia$')]).trim():null,
      lat:r[col('^latitud$')]?parseFloat(r[col('^latitud$')]):null,
      lon:r[col('^longitud$')]?parseFloat(r[col('^longitud$')]):null,
      numero_orden:r[col('orden')]?String(r[col('orden')]).trim():null,
      cliente_origen:r[col('primario')]?String(r[col('primario')]).trim():null,
      peso:r[col('peso')]?parseFloat(r[col('peso')]):null,
      fecha_creacion:parseFecha(r[col('creaci[oó]n')]),
      fecha_promesa:parseFecha(r[col('promesa')]),
    }));
    _importData={paquetes,contCode,fileName:file.name};
    prev.innerHTML=`<div style="margin-top:14px">
      <div class="card" style="cursor:default">
        <div style="margin-bottom:8px"><span class="b b-bl">📦 ${esc(contCode)}</span></div>
        <div class="stat-row">
          <div class="stat"><div class="stat-n">${paquetes.length}</div><div class="stat-l">Paquetes</div></div>
          <div class="stat"><div class="stat-n">${new Set(paquetes.map(p=>p.guia)).size}</div><div class="stat-l">Únicos</div></div>
        </div>
        <div style="font-size:var(--fss);color:var(--tx3)">📁 ${esc(file.name)}</div>
      </div>
      <button class="btn btn-g btn-w" onclick="doImport()" id="importBtn">✓ Importar ${paquetes.length} paquetes</button>
      <button class="btn btn-o btn-w" style="margin-top:8px" onclick="pgImportar()">Cancelar</button>
    </div>`;
  }catch(e){prev.innerHTML=`<p style="color:var(--red);margin-top:12px">${esc(e.message)}</p>`;}
}
async function doImport(){
  if(!_importData)return;
  const btn=document.getElementById('importBtn');
  btn.disabled=true;
  const{paquetes,contCode,fileName}=_importData;
  try{
    let{data:ec}=await sb.from('contenedores').select('id').eq('codigo',contCode).maybeSingle();
    let contId;
    if(ec){contId=ec.id;}
    else{
      const{data:nc,error:ce}=await sb.from('contenedores').insert({
        codigo:contCode,fecha_recepcion:todayISO(),
        cliente_origen:paquetes[0]?.cliente_origen||null,
        estado:'pendiente',total_paquetes:paquetes.length,
        archivo_original:fileName,importado_por:S.user.id
      }).select().single();
      if(ce)throw ce;
      contId=nc.id;
    }
    setP(`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;text-align:center">
      <div class="sp" style="width:40px;height:40px;border-width:4px"></div>
      <div style="font-size:var(--fsm);font-weight:600">Importando...</div>
      <div style="font-size:var(--fss);color:var(--tx2)" id="importSub">0 de ${paquetes.length}</div>
      <div style="width:220px"><div class="progress"><div class="progress-bar" id="importBar" style="width:0%"></div></div></div>
    </div>`);
    let ok=0,conZona=0;
    const bs=50;
    for(let i=0;i<paquetes.length;i+=bs){
      const batch=paquetes.slice(i,i+bs);
      const res=await Promise.all(batch.map(p=>
        sb.rpc('importar_paquete',{
          p_num_guia:p.guia,p_contenedor_id:contId,
          p_destinatario:p.destinatario,p_telefono:p.telefono,
          p_direccion_original:p.direccion,p_codigo_postal:p.cp,
          p_municipio:p.municipio,p_colonia:p.colonia,
          p_lat_proveedor:p.lat,p_lon_proveedor:p.lon,
          p_numero_orden:p.numero_orden,p_cliente_origen:p.cliente_origen,
          p_peso_kg:p.peso,p_fecha_creacion_guia:p.fecha_creacion,
          p_fecha_promesa_entrega:p.fecha_promesa,p_importado_por:S.user.id
        }).then(({data,error})=>{if(error)return null;return data?.[0]||data;})
      ));
      res.forEach(r=>{if(!r)return;if(r.resultado==='nuevo'||r.resultado==='actualizado')ok++;if(r.zona_id)conZona++;});
      const pct=Math.round(100*(i+batch.length)/paquetes.length);
      const b=document.getElementById('importBar'),s=document.getElementById('importSub');
      if(b)b.style.width=pct+'%';if(s)s.textContent=`${i+batch.length} de ${paquetes.length}`;
    }
    await sb.from('contenedores').update({total_paquetes:ok,estado:'en_proceso'}).eq('id',contId);
    S._contTab='zonas';
    setP(`<div style="padding:14px">
      <div class="card" style="cursor:default;border-color:var(--grn)">
        <div style="color:var(--grn);font-weight:600;margin-bottom:10px">✓ Importación completada</div>
        <div class="stat-row">
          <div class="stat"><div class="stat-n">${ok}</div><div class="stat-l">Importados</div></div>
          <div class="stat"><div class="stat-n" style="color:var(--acc)">${conZona}</div><div class="stat-l">Con zona</div></div>
          <div class="stat"><div class="stat-n" style="color:${ok-conZona>0?'var(--amb)':'var(--tx3)'}">${ok-conZona}</div><div class="stat-l">Sin zona</div></div>
        </div>
      </div>
      <button class="btn btn-p btn-w" onclick="go('asignar')">Asignar paquetes →</button>
      <button class="btn btn-o btn-w" style="margin-top:8px" onclick="S._contId='${contId}';S._contCodigo='${esc(contCode)}';go('cont-detalle')">Ver contenedor</button>
    </div>`);
    _importData=null;toast(`${ok} paquetes importados ✓`,'ok');
  }catch(e){toast('Error: '+e.message,'er');btn.disabled=false;btn.textContent='Reintentar';}
}

async function pgAsignar(){
  setBar('Asignar paquetes','');
  setP(loader());
  const [{data:mensList},{data:adminList},{data:bolsasRaw}] = await Promise.all([
    sb.from('mensajeros').select('id,nombre_completo,zona_principal').eq('activo',true).order('nombre_completo'),
    sb.from('profiles').select('id,nombre_completo').eq('activo',true).in('rol',['admin','operador']).order('nombre_completo'),
    // Bolsas pendientes: paquetes con bolsa_nombre, sin mensajero asignado
    sb.from('paquetes').select('bolsa_nombre')
      .not('bolsa_nombre','is',null)
      .in('estado',['pendiente','verificado'])
      .is('mensajero_id',null).is('mensajero_simple_id',null),
  ]);

  // Agrupar bolsas por nombre con conteo
  const bolsasMap={};
  (bolsasRaw||[]).forEach(p=>{
    const n=p.bolsa_nombre;
    if(!bolsasMap[n])bolsasMap[n]=0;
    bolsasMap[n]++;
  });
  const bolsas=Object.entries(bolsasMap).sort((a,b)=>a[0].localeCompare(b[0]));

  const todosLosAsignables = [
    ...(mensList||[]).map(m=>({...m,tipo:'mensajero'})),
    ...(adminList||[]).map(a=>({...a,tipo:'profile'})),
  ];
  S.mensajeros = todosLosAsignables;

  const selOpts=todosLosAsignables.map(m=>`<option value="${m.tipo}:${m.id}">${esc(m.nombre_completo)}${m.zona_principal?' ('+esc(m.zona_principal)+')':''}</option>`).join('');

  let h=`
    <div style="margin-bottom:14px">
      <label>Mensajero</label>
      <select class="inp sel" id="selMens">
        <option value="">— Seleccionar —</option>
        <option value="SIN_ASIGNAR">Sin asignar (bolsa)</option>
        ${selOpts}
      </select>
    </div>
    <div id="bolsaWrap" style="display:none;margin-bottom:14px">
      <label>Nombre de bolsa</label>
      <input class="inp" id="bolsaNombre" placeholder="Ej: Imperial A, Bolsa Norte...">
    </div>
    <button class="btn btn-p btn-w" onclick="iniciarAsignacion()">Iniciar escaneo →</button>
    <div style="margin-top:10px;padding:10px;background:var(--bg);border-radius:var(--r2);font-size:var(--fss);color:var(--tx3)">
      ℹ️ Se aceptan paquetes de cualquier contenedor activo
    </div>`;

  // Bolsas pendientes
  if(bolsas.length){
    h+=`<div class="sec-title" style="margin-top:18px">Bolsas pendientes de asignar (${bolsas.length})</div>`;
    bolsas.forEach(([nombre,count])=>{
      h+=`<div class="card">
        <div class="card-row">
          <div class="ci" style="background:rgba(245,158,11,.12);color:var(--amb);font-size:20px">🛍</div>
          <div style="flex:1;min-width:0">
            <div class="ct">${esc(nombre)}</div>
            <div class="cs">${count} paquete${count!==1?'s':''} sin asignar</div>
          </div>
        </div>
        <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--brd);display:flex;gap:8px;align-items:center">
          <select class="inp sel" id="selBolsa_${esc(nombre)}" style="flex:1;font-size:12px">
            <option value="">— Asignar a... —</option>
            ${selOpts}
          </select>
          <button class="btn btn-g btn-s" onclick="asignarBolsa('${esc(nombre)}',${count})">Asignar</button>
        </div>
      </div>`;
    });
  }

  setP(h);
  const selEl=document.getElementById('selMens');
  if(selEl) selEl.onchange=function(){
    const bw=document.getElementById('bolsaWrap');
    if(bw)bw.style.display=this.value==='SIN_ASIGNAR'?'block':'none';
  };
}

async function asignarBolsa(nombreBolsa, count){
  const selId=`selBolsa_${nombreBolsa}`;
  const val=document.getElementById(selId)?.value;
  if(!val){toast('Selecciona un mensajero','er');return;}
  const[tipo,id]=val.split(':');
  const mNombre=S.mensajeros.find(m=>m.id===id)?.nombre_completo||'Mensajero';

  dialog(
    'Asignar bolsa',
    `¿Asignar "${nombreBolsa}" (${count} paquetes) a ${mNombre}?`,'',
    [
      {l:'Cancelar',fn:closeDlg},
      {l:'Asignar',c:'btn-g',fn:async()=>{
        closeDlg();
        setP(`<div class="ld"><div class="sp"></div><p style="color:var(--tx2)">Asignando ${count} paquetes...</p></div>`);
        try{
          // Traer todos los paquetes de la bolsa
          const{data:paqBolsa}=await sb.from('paquetes')
            .select('id')
            .eq('bolsa_nombre',nombreBolsa)
            .in('estado',['pendiente','verificado'])
            .is('mensajero_id',null).is('mensajero_simple_id',null);

          if(!paqBolsa?.length){toast('No se encontraron paquetes en la bolsa','wa');pgAsignar();return;}

          // Actualizar en lotes
          const upd=tipo==='mensajero'
            ?{estado:'asignado',mensajero_simple_id:id,mensajero_id:null,bolsa_nombre:null}
            :{estado:'asignado',mensajero_id:id,mensajero_simple_id:null,bolsa_nombre:null};

          // Batch update de 100 en 100
          for(let i=0;i<paqBolsa.length;i+=100){
            const lote=paqBolsa.slice(i,i+100).map(p=>p.id);
            await sb.from('paquetes').update({...upd,updated_by:S.user.id}).in('id',lote);
            // Historial
            const hist=lote.map(pid=>({
              paquete_id:pid,accion:'asignado',estado_nuevo:'asignado',
              mensajero_nuevo:tipo==='profile'?id:null,
              mensajero_simple_nuevo:tipo==='mensajero'?id:null,
              realizado_por:S.user.id,
              nota:`Asignado desde bolsa: ${nombreBolsa}`,
            }));
            await sb.from('historial_paquetes').insert(hist);
          }

          toast(`${paqBolsa.length} paquetes asignados a ${mNombre} ✓`,'ok');
          pgAsignar();
        }catch(e){
          toast('Error: '+e.message,'er');
          pgAsignar();
        }
      }}
    ]
  );
}
function iniciarAsignacion(){
  const val=document.getElementById('selMens').value;
  if(!val){toast('Selecciona un mensajero','er');return;}
  if(val==='SIN_ASIGNAR'){
    S.asigMensId='SIN_ASIGNAR';
    S.asigMensTipo='bolsa';
    S.asigMensNombre=document.getElementById('bolsaNombre')?.value?.trim()||'Bolsa';
  } else {
    const [tipo,id]=val.split(':');
    S.asigMensId=id;
    S.asigMensTipo=tipo; // 'mensajero' o 'profile'
    S.asigMensNombre=S.mensajeros.find(m=>m.id===id)?.nombre_completo||'Mensajero';
  }
  S.asigLista=[];
  go('asignar-scan');
}
function pgAsignarScan(){
  setBar('Escaneando',S.asigMensNombre);
  setP(`
    <div class="scan-area" id="scanArea"><video id="scanVid" autoplay playsinline muted></video><div class="scan-line"></div></div>
    <div style="text-align:center;color:var(--tx2);font-size:var(--fss);margin:6px 0" id="sst">Apunta al código</div>
    <div style="display:flex;gap:8px;margin:8px 0">
      <input class="inp" id="miInput" placeholder="O escribe la guía..." style="flex:1"
        onkeydown="if(event.key==='Enter'){const v=this.value.trim();if(v){const g=cleanGuia(v);if(g)onAsigCode(g);else toast('No válido','er');this.value='';}}" >
      <button class="btn btn-p btn-s" onclick="const inp=document.getElementById('miInput');const v=inp.value.trim();if(v){const g=cleanGuia(v);if(g)onAsigCode(g);else toast('No válido','er');inp.value='';}">OK</button>
    </div>
    <div id="scanResults" style="max-height:160px;overflow-y:auto"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-o" style="flex:1" id="btnVerLista" onclick="go('asignar-lista')">Ver lista (0)</button>
      <button class="btn btn-g" style="flex:1" onclick="confirmarAsignacion()">Confirmar ✓</button>
    </div>

async function onAsigCode(guia){
  if(S.asigLista.find(i=>i.guia===guia)){toast('Ya escaneado','wa');return;}
  const{data:paq}=await sb.from('paquetes')
    .select('id,estado,mensajero_id,mensajero_simple_id,zona_id,zonas(nombre),profiles!mensajero_id(nombre_completo),mensajeros_data:mensajeros!mensajero_simple_id(nombre_completo),contenedores(codigo)')
    .eq('num_guia',guia).maybeSingle();
  const el=document.getElementById('scanResults');
  const updCount=()=>{const b=document.getElementById('btnVerLista');if(b)b.textContent=`Ver lista (${S.asigLista.length})`;};
  if(!paq){
    // No existe en BD → marcar como sobrante nuevo
    S.asigLista.push({guia,estado:'sobrante',zona:'SOBRANTE',contCodigo:'—'});
    el.innerHTML=`<div class="scan-result" style="background:rgba(239,68,68,.1);color:var(--red)">📍 ${guia} — SOBRANTE (nuevo)</div>`+el.innerHTML;
    beep('wa');updCount();return;
  }
  // Si existe pero es un sobrante previo sin asignar, tratarlo como disponible
  if(paq.destinatario==='SOBRANTE'&&['pendiente','verificado'].includes(paq.estado)&&!paq.mensajero_id&&!paq.mensajero_simple_id){
    S.asigLista.push({guia,estado:'disponible',zona:'SOBRANTE',paqId:paq.id,contCodigo:'—'});
    el.innerHTML=`<div class="scan-result" style="background:rgba(245,158,11,.1);color:var(--amb)">📍 ${guia} — SOBRANTE existente (asignando)</div>`+el.innerHTML;
    beep('ok');updCount();return;
  }
  const zona=paq.zonas?.nombre||'Sin zona';
  const cont=paq.contenedores?.codigo||'—';
  // Verificar si está asignado al mismo mensajero (sea simple o profile)
  const yaEsMio=(S.asigMensTipo==='mensajero'&&paq.mensajero_simple_id===S.asigMensId
               ||S.asigMensTipo==='profile'&&paq.mensajero_id===S.asigMensId)
               &&['asignado','en_ruta','verificado'].includes(paq.estado);
  const esDeOtro=(paq.mensajero_simple_id||paq.mensajero_id)&&!yaEsMio&&['asignado','en_ruta'].includes(paq.estado);
  if(yaEsMio){
    el.innerHTML=`<div class="scan-result" style="background:rgba(59,130,246,.1);color:var(--acc)">ℹ️ ${guia} — ya asignado a ti (${zona})</div>`+el.innerHTML;
    beep('wa');return;
  }
  if(esDeOtro){
    const otro=paq.mensajeros_data?.nombre_completo||paq.profiles?.nombre_completo||'otro mensajero';
    beep('wa');
    dialog('Paquete ya asignado',`Está con ${otro}. ¿Reasignar a ${S.asigMensNombre}?`,guia,[
      {l:'No, dejar',fn:closeDlg},
      {l:'Sí, reasignar',c:'btn-p',fn:()=>{
        closeDlg();
        S.asigLista.push({guia,estado:'reasignar',zona,paqId:paq.id,contCodigo:cont});
        el.innerHTML=`<div class="scan-result" style="background:rgba(245,158,11,.1);color:var(--amb)">↔️ ${guia} — REASIGNAR (${zona})</div>`+el.innerHTML;
        beep('ok');updCount();
      }}
    ]);
    return;
  }
  S.asigLista.push({guia,estado:'disponible',zona,paqId:paq.id,contCodigo:cont});
  el.innerHTML=`<div class="scan-result" style="background:rgba(16,185,129,.1);color:var(--grn)">✓ ${guia} — ${zona} · ${cont}</div>`+el.innerHTML;
  beep('ok');updCount();
}

}
let _confirmando=false;
async function confirmarAsignacion(){
  if(!S.asigLista.length){toast('No hay paquetes','er');return;}
  if(_confirmando)return;
  _confirmando=true;

  // NO deshabilitar botones del nav — solo mostrar pantalla de carga
  // que reemplaza el contenido y hace imposible tocar los botones de la lista
  const total=S.asigLista.length;
  const esSinAsignar=S.asigMensId==='SIN_ASIGNAR';
  const nuevoEstado=esSinAsignar?'verificado':'asignado';

  setP(`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;text-align:center">
    <div class="sp" style="width:40px;height:40px;border-width:4px"></div>
    <div style="font-size:var(--fsm);font-weight:600" id="confirmMsg">Guardando...</div>
    <div style="font-size:var(--fss);color:var(--tx2)" id="confirmSub">0 de ${total}</div>
    <div style="width:220px"><div class="progress"><div class="progress-bar" id="confirmBar" style="width:0%"></div></div></div>
  </div>`);

  let ok=0,errs=0;
  try{
    for(let i=0;i<S.asigLista.length;i++){
      const item=S.asigLista[i];
      const b=document.getElementById('confirmBar'),s=document.getElementById('confirmSub');
      if(b)b.style.width=Math.round(100*i/total)+'%';
      if(s)s.textContent=`${i} de ${total}`;
      try{
        if(item.estado==='sobrante'){
          // Usar RPC que maneja todos los constraints de la tabla paquetes
          const mensSimple=(!esSinAsignar&&S.asigMensTipo==='mensajero')?S.asigMensId:null;
          const mensProfile=(!esSinAsignar&&S.asigMensTipo==='profile')?S.asigMensId:null;

          const{data:paqId,error:rpcErr}=await sb.rpc('insertar_sobrante',{
            p_num_guia:item.guia,
            p_mensajero_id:mensProfile,
            p_mensajero_simple_id:mensSimple,
            p_importado_por:S.user.id,
          });
          if(rpcErr){console.error('Sobrante RPC error:',rpcErr);throw rpcErr;}

          if(paqId) await sb.from('historial_paquetes').insert({
            paquete_id:paqId,
            accion:'asignado',
            estado_nuevo:nuevoEstado,
            mensajero_nuevo:mensProfile,
            mensajero_simple_nuevo:mensSimple,
            nota:'Sobrante escaneado',
            realizado_por:S.user.id
          });
        }else{
          const upd={estado:nuevoEstado,updated_by:S.user.id};
          if(esSinAsignar){
            upd.mensajero_simple_id=null;
            upd.mensajero_id=null;
            upd.bolsa_nombre=S.asigMensNombre||'Bolsa';
          } else if(S.asigMensTipo==='mensajero'){
            upd.mensajero_simple_id=S.asigMensId; upd.mensajero_id=null;
          } else {
            upd.mensajero_id=S.asigMensId; upd.mensajero_simple_id=null;
          }
          await sb.from('paquetes').update(upd).eq('id',item.paqId);
          await sb.from('historial_paquetes').insert({
            paquete_id:item.paqId,
            accion:item.estado==='reasignar'?'reasignado':'asignado',
            estado_nuevo:nuevoEstado,
            mensajero_nuevo:(!esSinAsignar&&S.asigMensTipo==='profile')?S.asigMensId:null,
            mensajero_simple_nuevo:(!esSinAsignar&&S.asigMensTipo==='mensajero')?S.asigMensId:null,
            realizado_por:S.user.id
          });
        }
        ok++;
      }catch(e){errs++;console.error('Error asignando item:',item,e);}
    }

    const b=document.getElementById('confirmBar'),m=document.getElementById('confirmMsg'),s=document.getElementById('confirmSub');
    if(b){b.style.width='100%';b.style.background=errs?'var(--amb)':'var(--grn)';}
    if(m)m.textContent=errs?`Completado con ${errs} errores`:'¡Listo!';
    if(s)s.textContent=`${ok} paquetes guardados`;
    beep(errs?'wa':'ok');
    await new Promise(r=>setTimeout(r,800));

  }catch(e){
    toast('Error inesperado: '+e.message,'er');
  }finally{
    // SIEMPRE se ejecuta — garantiza que la app nunca queda bloqueada
    _confirmando=false;
    S.asigLista=[];
    // Rehabilitar botones del nav explícitamente por si acaso
    document.querySelectorAll('.nav .nb').forEach(b=>b.disabled=false);
  }

  // Navegar siempre, sin importar resultado
  try{
    toast(`${ok} asignados ✓${errs?`, ${errs} errores`:''}`,'ok');
    await go('asignar');
  }catch(e){
    // Si go() falla, forzar home como fallback
    toast('Volviendo al inicio...','wa');
    await go('home',false);
  }
}

async function agregarMensajero(){
  const nombre=document.getElementById('mNombre')?.value?.trim();
  const tel=document.getElementById('mTel')?.value?.trim()||null;
  const zona=document.getElementById('mZona')?.value||null;
  if(!nombre){toast('El nombre es obligatorio','er');return;}

  // Crear un UUID manual para mensajeros sin cuenta de auth
  const fakeId=crypto.randomUUID();

  // Necesitamos insertar en auth.users primero — no es posible sin service_role
  // Alternativa: usar un email ficticio único para identificarlos
  const fakeEmail=nombre.toLowerCase().replace(/\s+/g,'.')+'.'+Date.now()+'@mensajero.stc';

  try{
    // Crear usuario en auth con contraseña temporal (no la usarán)
    const{data:authData,error:authErr}=await sb.auth.admin?.createUser({
      email:fakeEmail, password:'STCTemp2026!', email_confirm:true
    });
    // Si no tenemos permisos admin, usar inserción directa en profiles con UUID generado
    // (requiere que el FK de profiles sea opcional o que creemos un auth user real)
    // Por ahora usamos un workaround: insertar solo en profiles sin FK de auth
    // Esto requiere quitar el FK constraint o usar service role

    // Usamos la API de signup pero sin email_confirm para mensajeros
    // Lo más práctico: crear una función SQL que lo haga
    const{data,error}=await sb.rpc('crear_mensajero',{
      p_nombre: nombre,
      p_telefono: tel,
      p_zona: zona,
      p_admin_id: S.user.id
    });
    if(error)throw error;
    toast(`${nombre} agregado ✓`,'ok');
    document.getElementById('mNombre').value='';
    document.getElementById('mTel').value='';
  }catch(e){
    toast('Error: '+e.message,'er');
  }
}

async function handleMensFile(file){
  if(!file)return;
  const res=document.getElementById('mensImportResult');
  res.innerHTML=loader();
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(!rows.length){res.innerHTML='<p class="empty">Archivo vacío</p>';return;}

    const validos=rows.filter(r=>r.nombre_completo||r['Nombre Completo']||r['nombre']);
    if(!validos.length){res.innerHTML='<p style="color:var(--red)">No se encontró columna "nombre_completo"</p>';return;}

    // Preview antes de importar
    res.innerHTML=`<div class="card" style="cursor:default;margin-top:14px">
      <div style="font-weight:600;margin-bottom:8px">Vista previa: ${validos.length} mensajeros</div>
      <table class="tbl">
        <tr><th>Nombre</th><th>Teléfono</th><th>Zona</th></tr>
        ${validos.slice(0,5).map(r=>{
          const nm=r.nombre_completo||r['Nombre Completo']||r.nombre||'';
          const tel=r.telefono||r['Teléfono']||r.tel||'';
          const zona=r.zona_principal||r['Zona Principal']||r.zona||'';
          return `<tr><td>${esc(nm)}</td><td>${esc(tel)}</td><td>${esc(zona)}</td></tr>`;
        }).join('')}
        ${validos.length>5?`<tr><td colspan="3" style="color:var(--tx3)">... y ${validos.length-5} más</td></tr>`:''}
      </table>
    </div>
    <button class="btn btn-g btn-w" style="margin-top:10px" onclick="doImportMens()">Importar ${validos.length} mensajeros</button>`;

    // Guardar para importar
    window._mensData=validos;
  }catch(e){res.innerHTML=`<p style="color:var(--red)">${esc(e.message)}</p>`;}
}

async function doImportMens(){
  const rows=window._mensData;
  if(!rows?.length)return;
  const res=document.getElementById('mensImportResult');
  res.innerHTML=loader();
  let ok=0,errs=0;
  for(const r of rows){
    const nombre=(r.nombre_completo||r['Nombre Completo']||r.nombre||'').trim();
    const tel=(r.telefono||r['Teléfono']||r.tel||'').toString().trim()||null;
    const zona=(r.zona_principal||r['Zona Principal']||r.zona||'').trim()||null;
    if(!nombre){errs++;continue;}
    try{
      const{error}=await sb.rpc('crear_mensajero',{
        p_nombre:nombre, p_telefono:tel, p_zona:zona, p_admin_id:S.user.id
      });
      if(error)throw error;
      ok++;
    }catch(e){errs++;}
  }
  res.innerHTML=`<div class="card" style="cursor:default;border-color:${errs?'var(--amb)':'var(--grn)'}">
    <div style="color:${errs?'var(--amb)':'var(--grn)'};font-weight:600;margin-bottom:6px">
      ${errs?'Importación con errores':'✓ Importación completada'}
    </div>
    <div style="font-size:var(--fss);color:var(--tx2)">${ok} agregados · ${errs} errores</div>
  </div>
  <button class="btn btn-p btn-w" style="margin-top:10px" onclick="go('mensajeros')">Ver mensajeros →</button>`;
  if(ok>0)toast(`${ok} mensajeros agregados ✓`,'ok');
}

// ── Historial completo de un mensajero con filtro de fecha ──
async function pgMensPaquetes(){
  const mensId=S._mensId;
  const mensNombre=S._mensNombre||'Mensajero';
  if(!mensId){goBack();return;}
  if(!S._mensFecha)S._mensFecha=todayISO();
  setBar(mensNombre,'');

  const hoy=todayISO();
  const _ayer=new Date();_ayer.setDate(_ayer.getDate()-1);
  const ayer=_ayer.getFullYear()+'-'+String(_ayer.getMonth()+1).padStart(2,'0')+'-'+String(_ayer.getDate()).padStart(2,'0');
  
  const diaStart=S._mensFecha+'T00:00:00';
  const diaEnd=S._mensFecha+'T23:59:59';
  const fechaLabel=S._mensFecha===hoy?'Hoy':S._mensFecha===ayer?'Ayer':fmtDate(S._mensFecha);

  setP(loader());

  // Paquetes asignados en la fecha al mensajero
  // Para mensajeros simples, buscar paquetes asignados + fecha de asignación
  // historial_paquetes.mensajero_nuevo solo tiene profiles, así que buscamos
  // directamente en paquetes filtrado por fecha del historial
  // Buscar paquetes asignados a este mensajero en la fecha
  const{data:paqAsig}=await sb.from('paquetes')
    .select('id,num_guia,destinatario,direccion_original,estado,zonas(nombre),contenedores(codigo)')
    .or(`mensajero_simple_id.eq.${mensId},mensajero_id.eq.${mensId}`);
  // Filtrar por fechas del historial (más simple que el join)
  const{data:histAsig}=await sb.from('historial_paquetes')
    .select('paquete_id,realizado_en')
    .eq('accion','asignado')
    .gte('realizado_en',diaStart)
    .lte('realizado_en',diaEnd);
  const histMap=new Map(histAsig?.map(h=>[h.paquete_id,h.realizado_en])||[]);
  const paqAsig_filtered=(paqAsig||[]).filter(p=>histMap.has(p.id));
  const eventos=(paqAsig||[]).map(p=>({
    paquete_id:p.id,
    realizado_en:p.historial_paquetes?.[0]?.realizado_en,
    paquetes:p
  }));

  const paquetes=eventos||[];
  const entr=paquetes.filter(e=>e.paquetes?.estado==='entregado').length;
  const dev=paquetes.filter(e=>e.paquetes?.estado==='devuelto').length;
  const pend=paquetes.length-entr-dev;

  const seg=`<div class="seg">
    <button class="seg-btn ${S._mensFecha===hoy?'on':''}" onclick="S._mensFecha='${hoy}';pgMensPaquetes()">Hoy</button>
    <button class="seg-btn ${S._mensFecha===ayer?'on':''}" onclick="S._mensFecha='${ayer}';pgMensPaquetes()">Ayer</button>
    <button class="seg-btn" onclick="pickFechaMens()">📅 ${S._mensFecha!==hoy&&S._mensFecha!==ayer?fmtDate(S._mensFecha):'Fecha'}</button>
  </div>`;

  const stats=`<div class="stat-row">
    <div class="stat"><div class="stat-n">${paquetes.length}</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--grn)">${entr}</div><div class="stat-l">Entregados</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--red)">${dev}</div><div class="stat-l">Devueltos</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--acc)">${pend}</div><div class="stat-l">En curso</div></div>
  </div>`;

  let lista='';
  if(!paquetes.length){lista=`<p class="empty">Sin paquetes ${fechaLabel.toLowerCase()}</p>`;}
  else{
    paquetes.forEach(ev=>{
      const p=ev.paquetes;if(!p)return;
      lista+=`<div class="card" style="cursor:default">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="min-width:0;flex:1">
            <div style="font-family:var(--mo);font-size:var(--fss);font-weight:600;color:var(--acc)">${esc(p.num_guia)}</div>
            <div style="font-size:var(--fss);margin-top:1px">${esc(p.destinatario)}</div>
            <div style="font-size:var(--fss);color:var(--tx2)">${esc((p.direccion_original||'').slice(0,50))}</div>
            <div style="margin-top:3px;display:flex;gap:4px;flex-wrap:wrap">
              <span class="chip">${esc(p.zonas?.nombre||'Sin zona')}</span>
              <span style="font-size:var(--fss);color:var(--tx3)">${esc(p.contenedores?.codigo||'')}</span>
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <span class="b ${stColor[p.estado]||'b-gy'}">${esc(p.estado)}</span>
            <div style="font-size:10px;color:var(--tx3);margin-top:3px">${fmtTime(ev.realizado_en)}</div>
          </div>
        </div>
      </div>`;
    });
  }
  setP(seg+stats+lista);
}

async function doSearch(){
  const guia=cleanGuia(document.getElementById('buscarInput')?.value);
  if(!guia){toast('Ingresa una guía','er');return;}
  const res=document.getElementById('buscarResult');
  res.innerHTML=loader();

let _scanLastCode=null,_scanLastTime=0,_scanLocked=false;
const SCAN_COOLDOWN_MS=1500;
async function initScan(callback){
  S.scanCb=callback;_scanLastCode=null;_scanLastTime=0;_scanLocked=false;
  try{
    const vid=document.getElementById('scanVid');if(!vid)return;
    S.scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}}});
    vid.srcObject=S.scanStream;await vid.play();
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['code_128','ean_13','ean_8','code_39']});
      const loop=async()=>{
        if(!S.scanStream)return;
        const now=Date.now();
        if(!_scanLocked&&(now-_scanLastTime)>=SCAN_COOLDOWN_MS){
          try{
            const codes=await det.detect(vid);
            if(codes.length){
              const g=cleanGuia(codes[0].rawValue);
              if(g&&(g!==_scanLastCode||(now-_scanLastTime)>=SCAN_COOLDOWN_MS*2)){
                _scanLastCode=g;_scanLastTime=now;_scanLocked=true;
                const line=document.querySelector('.scan-line');
                if(line){line.style.background='var(--grn)';line.style.boxShadow='0 0 8px var(--grn)';}
                if(S.scanCb)await S.scanCb(g);
                setTimeout(()=>{const l=document.querySelector('.scan-line');if(l){l.style.background='var(--red)';l.style.boxShadow='0 0 8px var(--red)';}  _scanLocked=false;},SCAN_COOLDOWN_MS);
              }
            }
          }catch(e){}
        }
        if(S.scanStream)setTimeout(()=>requestAnimationFrame(loop),100);
      };
      requestAnimationFrame(loop);
    }else{
      const area=document.getElementById('scanArea');
      if(area)area.innerHTML+='<div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);padding:8px;text-align:center;font-size:var(--fss);color:var(--amb)">Usa el campo de texto</div>';
    }
  }catch(e){
    const area=document.getElementById('scanArea');
    if(area)area.innerHTML='<div style="padding:20px;text-align:center;color:var(--tx3)">Cámara no disponible</div>';
  }
}
function stopScan(){
  if(S.scanStream){S.scanStream.getTracks().forEach(t=>t.stop());S.scanStream=null;}
  S.scanCb=null;_scanLastCode=null;_scanLocked=false;
}

const MESES_ES=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const TARIFAPAQ=2000;

// Calcula quincena según las reglas: Q1=31ant+1-15, Q2=16-30
function calcQuincena(fecha){
  const d=new Date(fecha+'T12:00:00');
  const dia=d.getDate(), mes=d.getMonth()+1, año=d.getFullYear();
  if(dia>=16&&dia<=30) return {quincena:'Q2',mes,año};
  if(dia===31){
    // Día 31 → Q1 del mes siguiente
    const sig=new Date(año,mes,1);
    return {quincena:'Q1',mes:sig.getMonth()+1,año:sig.getFullYear()};
  }
  // Días 1–15
  return {quincena:'Q1',mes,año};
}

// Rango de fechas de una quincena dada
function rangoQuincena(mes,año,quincena){
  if(quincena==='Q2'){
    return {desde:new Date(año,mes-1,16), hasta:new Date(año,mes-1,30)};
  }else{
    // Q1: día 31 del mes anterior (si existe) hasta día 15
    const mesPrevio=mes===1?12:mes-1;
    const añoPrevio=mes===1?año-1:año;
    const ultimoMesPrevio=new Date(añoPrevio,mesPrevio,0).getDate();
    const desde=ultimoMesPrevio===31?new Date(añoPrevio,mesPrevio-1,31):new Date(año,mes-1,1);
    return {desde, hasta:new Date(año,mes-1,15)};
  }
}

function fmtCOP(v){return'$'+Number(v||0).toLocaleString('es-CO');}
function fmtRango(mes,año,q){
  const r=rangoQuincena(mes,año,q);
  const opts={day:'2-digit',month:'short'};
  return r.desde.toLocaleDateString('es-CO',opts)+' – '+r.hasta.toLocaleDateString('es-CO',opts)+' '+año;
}
