// ── PDF Resumen de quincena para contabilidad ──
async function descargarResumenQuincena(quinId, quinNombre){
  // Cargar mensajeros de la quincena
  const{data:mensajeros}=await sb.from('quincena_mensajeros')
    .select('id,nombre_display,total_entregas,total_bruto,en_bd,mensajero_id,mensajeros(banco,num_cuenta,tipo_cuenta)')
    .eq('quincena_id',quinId)
    .order('total_bruto',{ascending:false});
  if(!mensajeros?.length){toast('Sin datos','wa');return;}

  // Obtener datos de la quincena para consultar descuentos
  const{data:quinData}=await sb.from('quincenas').select('mes,año,quincena').eq('id',quinId).single();

  // Cargar descuentos pendientes de todos los mensajeros con ID de esta quincena
  let descMap={};
  if(quinData){
    const mensIds=mensajeros.filter(m=>m.mensajero_id).map(m=>m.mensajero_id);
    if(mensIds.length){
      const{data:descs}=await sb.from('descuentos')
        .select('mensajero_id,valor')
        .in('mensajero_id',mensIds)
        .eq('mes_quincena',quinData.mes)
        .eq('año_quincena',quinData.año)
        .eq('quincena',quinData.quincena)
        .eq('aplicado',false);
      (descs||[]).forEach(d=>{
        descMap[d.mensajero_id]=(descMap[d.mensajero_id]||0)+Number(d.valor||0);
      });
    }
  }

  // Calcular totales netos
  const mensajerosConNeto=mensajeros.map(m=>({
    ...m,
    total_descuentos:descMap[m.mensajero_id]||0,
    total_neto:Number(m.total_bruto||0)-(descMap[m.mensajero_id]||0),
  }));

  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const PW=297,ML=12,MR=12,CW=PW-ML-MR;
  let y=12;
  const DARK=[15,23,42],GRAY=[100,116,139],LIGHT=[241,245,249],GREEN=[16,185,129],BLUE=[59,130,246],WHITE=[255,255,255],RED=[239,68,68];
  const fecha=new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'});

  // Encabezado
  doc.setFillColor(...DARK);doc.rect(0,0,PW,30,'F');
  doc.setFontSize(18);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
  doc.text('STC Express',ML,y+10);
  doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(148,163,184);
  doc.text('Resumen de nómina para contabilidad',ML,y+18);
  doc.setFontSize(8);doc.setTextColor(148,163,184);
  doc.text(fecha,PW-MR,y+10,{align:'right'});
  doc.setFillColor(...BLUE);doc.roundedRect(PW-MR-60,y+12,60,11,2,2,'F');
  doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
  doc.text(quinNombre.slice(0,28),PW-MR-30,y+19,{align:'center'});
  y=36;

  // Totales resumen
  const totalBruto=mensajerosConNeto.reduce((s,m)=>s+Number(m.total_bruto||0),0);
  const totalDescuentosGlobal=mensajerosConNeto.reduce((s,m)=>s+m.total_descuentos,0);
  const totalNeto=mensajerosConNeto.reduce((s,m)=>s+m.total_neto,0);
  const totalEntr=mensajerosConNeto.reduce((s,m)=>s+Number(m.total_entregas||0),0);

  doc.setFillColor(...LIGHT);doc.roundedRect(ML,y,CW,14,2,2,'F');
  doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(...DARK);
  doc.text(`Bruto: ${fmtCOP(totalBruto)}`,ML+4,y+6);
  if(totalDescuentosGlobal>0){
    doc.setTextColor(...RED);
    doc.text(`Descuentos: -${fmtCOP(totalDescuentosGlobal)}`,ML+70,y+6);
  }
  doc.setTextColor(...GREEN);
  doc.text(`TOTAL NETO: ${fmtCOP(totalNeto)}`,ML+4,y+12);
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...GRAY);
  doc.text(`${mensajerosConNeto.length} mensajeros · ${totalEntr.toLocaleString()} entregas`,PW-MR-4,y+9,{align:'right'});
  y+=20;

  // Cabecera tabla
  doc.setFillColor(...DARK);doc.rect(ML,y,CW,7,'F');
  doc.setFontSize(6.5);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
  doc.text('#',ML+2,y+4.8);
  doc.text('Mensajero',ML+10,y+4.8);
  doc.text('Banco',ML+90,y+4.8);
  doc.text('Cuenta',ML+135,y+4.8);
  doc.text('Entregas',ML+190,y+4.8,{align:'center'});
  doc.text('Bruto',ML+218,y+4.8,{align:'right'});
  doc.text('Desc.',ML+240,y+4.8,{align:'right'});
  doc.text('NETO',PW-MR-2,y+4.8,{align:'right'});
  y+=7;

  mensajerosConNeto.forEach((m,i)=>{
    if(y>192){
      doc.addPage();y=12;
      doc.setFillColor(...DARK);doc.rect(ML,y,CW,7,'F');
      doc.setFontSize(6.5);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
      doc.text('#',ML+2,y+4.8);doc.text('Mensajero',ML+10,y+4.8);
      doc.text('Banco',ML+90,y+4.8);doc.text('Cuenta',ML+135,y+4.8);
      doc.text('Entregas',ML+190,y+4.8,{align:'center'});
      doc.text('Bruto',ML+218,y+4.8,{align:'right'});
      doc.text('Desc.',ML+240,y+4.8,{align:'right'});
      doc.text('NETO',PW-MR-2,y+4.8,{align:'right'});
      y+=7;
    }
    const bg=i%2===0?WHITE:[248,250,252];
    doc.setFillColor(...bg);doc.rect(ML,y,CW,7,'F');
    doc.setDrawColor(...LIGHT);doc.setLineWidth(0.2);doc.line(ML,y+7,PW-MR,y+7);
    doc.setFontSize(6.5);doc.setTextColor(...GRAY);doc.setFont('helvetica','normal');
    doc.text(String(i+1),ML+2,y+4.8);
    doc.setTextColor(...DARK);
    const nom=m.nombre_display.length>32?m.nombre_display.slice(0,31)+'…':m.nombre_display;
    doc.text(nom,ML+10,y+4.8);
    const banco=m.mensajeros?.banco||'—';
    const cuenta=m.mensajeros?.num_cuenta||'—';
    const tipo=m.mensajeros?.tipo_cuenta?` (${m.mensajeros.tipo_cuenta})`:'';
    doc.setTextColor(...GRAY);
    doc.text((banco+tipo).slice(0,20),ML+90,y+4.8);
    doc.setTextColor(...DARK);doc.setFont('helvetica','bold');
    doc.text(cuenta.slice(0,18),ML+135,y+4.8);
    doc.setTextColor(...BLUE);doc.setFont('helvetica','normal');
    doc.text(String(m.total_entregas||0),ML+190,y+4.8,{align:'center'});
    doc.setTextColor(150,150,150);
    doc.text(fmtCOP(m.total_bruto),ML+218,y+4.8,{align:'right'});
    if(m.total_descuentos>0){
      doc.setTextColor(...RED);
      doc.text(`-${fmtCOP(m.total_descuentos)}`,ML+240,y+4.8,{align:'right'});
    } else {
      doc.setTextColor(...GRAY);
      doc.text('—',ML+240,y+4.8,{align:'right'});
    }
    doc.setTextColor(...GREEN);doc.setFont('helvetica','bold');
    doc.text(fmtCOP(m.total_neto),PW-MR-2,y+4.8,{align:'right'});
    y+=7;
  });

  // Total final
  y+=3;
  doc.setFillColor(...GREEN);doc.roundedRect(ML,y,CW,9,2,2,'F');
  doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
  doc.text(`TOTAL NETO A PAGAR: ${fmtCOP(totalNeto)}`,ML+CW/2,y+6,{align:'center'});

  // Pie
  doc.setFontSize(6);doc.setFont('helvetica','normal');doc.setTextColor(...GRAY);
  doc.text(`STC Express · ${quinNombre} · Generado ${fecha}`,ML,202);

  const arch=quinNombre.replace(/[^a-zA-Z0-9]/g,'_');
  doc.save(`Nomina_${arch}.pdf`);
  toast('PDF de contabilidad generado ✓','ok');
}

async function liqHandleFile(file){
  if(!file)return;
  document.getElementById('liqFileLabel').textContent='⏳ Leyendo '+file.name+'...';
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});

    // Acepta hoja Sheet1 (nuevo formato xcargo) o BASE (formato anterior)
    const sheetName=wb.SheetNames.find(n=>n==='Sheet1')||wb.SheetNames.find(n=>n==='BASE')||wb.SheetNames[0];
    const baseSheet=wb.Sheets[sheetName];
    if(!baseSheet)throw new Error('No se encontró ninguna hoja válida en el archivo');

    const baseData=XLSX.utils.sheet_to_json(baseSheet);
    if(!baseData.length)throw new Error('El archivo está vacío');

    // Cargar mensajeros — incluir retirados para hacer match de usuarios prestados históricos
    const{data:mensDB}=await sb.from('mensajeros')
      .select('id,nombre_completo,num_documento,correo,usuario_xcargo,usuario_xcargo_prestado,usuario_propio,usuario_xcargo_anterior,fecha_cambio_usuario,fecha_ingreso,activo,fecha_retiro');

    const mensMapCorreo={};    // correo propio → mensajero
    const mensMapPrestado={};  // usuario_xcargo_prestado → [{mensajero, fechaIngreso}] (puede haber varios)
    const mensMapAnterior={};  // usuario_xcargo_anterior → {mensajero, fechaCorte}
    const mensMapCedula={};    // num_documento → mensajero (fallback)
    (mensDB||[]).forEach(m=>{
      if(m.correo) mensMapCorreo[m.correo.trim().toLowerCase()]=m;
      if(m.usuario_xcargo_prestado){
        const key=m.usuario_xcargo_prestado.trim().toLowerCase();
        if(!mensMapPrestado[key]) mensMapPrestado[key]=[];
        mensMapPrestado[key].push({m, fechaIngreso: m.fecha_ingreso ? new Date(m.fecha_ingreso) : null});
      }
      if(m.usuario_xcargo_anterior) mensMapAnterior[m.usuario_xcargo_anterior.trim().toLowerCase()]={m, fechaCorte: m.fecha_cambio_usuario ? new Date(m.fecha_cambio_usuario) : null};
      if(m.num_documento) mensMapCedula[String(m.num_documento).trim()]=m;
    });

    // Procesar filas — solo Entregado
    const df=baseData
      .filter(r=>String(r['Estatus orden en ruta']||'').trim()==='Entregado')
      .map(r=>{
        // Fecha: puede ser Date, número serial o string
        let fecha=r['Fecha y hora de salida'];
        if(fecha instanceof Date){}
        else if(typeof fecha==='number'){const d=XLSX.SSF.parse_date_code(fecha);fecha=new Date(d.y,d.m-1,d.d);}
        else if(typeof fecha==='string'&&fecha.trim()){fecha=new Date(fecha.trim());}
        else fecha=null;

        // Match 1: por correo operador propio
        const correoOp=String(r['Correo operador']||'').trim().toLowerCase();
        let mensajeroDB=correoOp?mensMapCorreo[correoOp]:null;

        // Match 2: por usuario xcargo prestado — verificar fecha_ingreso
        // Si varios mensajeros usaron el mismo correo prestado, tomar el que estaba activo en esa fecha
        if(!mensajeroDB&&correoOp&&mensMapPrestado[correoOp]){
          const candidatos=mensMapPrestado[correoOp];
          let fechaEntrega=r['Fecha y hora de salida'];
          if(typeof fechaEntrega==='number'){const d=XLSX.SSF.parse_date_code(fechaEntrega);fechaEntrega=new Date(d.y,d.m-1,d.d);}
          else if(!(fechaEntrega instanceof Date)) fechaEntrega=new Date(String(fechaEntrega));
          // Buscar el candidato cuya fecha_ingreso es <= fecha de entrega
          // Si solo hay uno sin fecha_ingreso, usarlo como fallback
          let mejorMatch=null;
          for(const c of candidatos){
            if(!c.fechaIngreso){
              if(!mejorMatch) mejorMatch=c.m; // fallback sin fecha
            } else if(fechaEntrega>=c.fechaIngreso){
              // Este mensajero ya estaba activo en esa fecha
              // Si hay varios, tomar el que tenga fecha_ingreso más reciente (el más nuevo)
              if(!mejorMatch||!mejorMatch.fecha_ingreso||(c.fechaIngreso>new Date(mejorMatch.fecha_ingreso))){
                mejorMatch=c.m;
              }
            }
          }
          mensajeroDB=mejorMatch||null;
        }

        // Match 3: por usuario anterior — solo si la entrega es ANTES de la fecha de cambio
        if(!mensajeroDB&&correoOp&&mensMapAnterior[correoOp]){
          const{m, fechaCorte}=mensMapAnterior[correoOp];
          // Si no hay fecha de corte o la entrega es anterior al corte → asignar al mensajero
          let fechaEntrega=r['Fecha y hora de salida'];
          if(typeof fechaEntrega==='number'){const d=XLSX.SSF.parse_date_code(fechaEntrega);fechaEntrega=new Date(d.y,d.m-1,d.d);}
          else if(!(fechaEntrega instanceof Date)) fechaEntrega=new Date(String(fechaEntrega));
          if(!fechaCorte||fechaEntrega<=fechaCorte) mensajeroDB=m;
        }

        // Match 4 (fallback): por cédula del campo Nombre operador
        const operadorRaw=String(r['Nombre operador']||'').trim();
        if(!mensajeroDB){
          const cedula=operadorRaw.match(/^(\d+)/)?.[1]||null;
          if(cedula)mensajeroDB=mensMapCedula[cedula]||null;
        }

        const valor=parseFloat(r['Valor paquete'])||TARIFAPAQ;

        return{
          fecha,
          correoOp,
          operadorRaw,
          nombreReal:mensajeroDB?.nombre_completo||operadorRaw,
          mensajeroId:mensajeroDB?.id||null,
          valor,
          tracking:String(r['Tracking number']||'').trim(),
        };
      })
      .filter(r=>r.fecha&&!isNaN(r.fecha));

    // Agrupar por mensajero para el selector
    const mensajerosMap={};
    df.forEach(r=>{
      const key=r.mensajeroId||r.correoOp||r.operadorRaw;
      if(!mensajerosMap[key])mensajerosMap[key]={
        nombre:r.nombreReal,
        id:r.mensajeroId,
        correo:r.correoOp,
        enBD:!!r.mensajeroId
      };
    });
    const mensajeros=Object.values(mensajerosMap).sort((a,b)=>a.nombre.localeCompare(b.nombre));

    S._liqData={archivo:file.name,df,mensajeros,mensajerosMap};

    // Detectar mes/año del archivo
    const meses={};
    df.forEach(r=>{if(r.fecha) meses[`${r.fecha.getFullYear()}-${r.fecha.getMonth()+1}`]=(meses[`${r.fecha.getFullYear()}-${r.fecha.getMonth()+1}`]||0)+1;});
    const topMes=Object.entries(meses).sort((a,b)=>b[1]-a[1])[0]?.[0];
    if(topMes){
      const[año,mes]=topMes.split('-').map(Number);
      S._liqAñoDetectado=año;
      S._liqMesDetectado=mes;
      const selMes=document.getElementById('liqMes');
      const inpAño=document.getElementById('liqAño');
      if(selMes) selMes.value=mes;
      if(inpAño) inpAño.value=año;

      // ── Guardar quincena automáticamente en BD para Q1 y Q2 ──
      // Detectar quincena según distribución de fechas del archivo
      const diasQ1=df.filter(r=>r.fecha&&r.fecha.getDate()<=15).length;
      const diasQ2=df.filter(r=>r.fecha&&r.fecha.getDate()>15).length;
      const quincenaDetectada=diasQ2>diasQ1?'Q2':'Q1';
      S._liqQuincenaDetectada=quincenaDetectada;

      // Pre-seleccionar quincena
      const selQ=document.getElementById('liqQuincena');
      if(selQ) selQ.value=quincenaDetectada;

      // Guardar/actualizar quincena
      const quinNombre=`${MESES_ES[mes]} ${año} · ${quincenaDetectada}`;
      document.getElementById('liqFileLabel').textContent='⏳ Guardando quincena...';

      try{
        // Buscar o crear quincena sin upsert
        let quin=null;
        {
          const{data:existeQ}=await sb.from('quincenas').select('id').eq('mes',mes).eq('año',año).eq('quincena',quincenaDetectada).maybeSingle();
          if(existeQ){
            await sb.from('quincenas').update({nombre:quinNombre,archivo_nombre:file.name}).eq('id',existeQ.id);
            quin=existeQ;
          } else {
            const{data:nuevaQ}=await sb.from('quincenas').insert({mes,año,quincena:quincenaDetectada,nombre:quinNombre,archivo_nombre:file.name}).select('id').single();
            quin=nuevaQ;
          }
        }

        if(quin?.id){
          S._liqQuinId=quin.id;
          // Limpiar datos anteriores de esta quincena para evitar duplicados
          const{data:qmExistentes}=await sb.from('quincena_mensajeros').select('id').eq('quincena_id',quin.id);
          if(qmExistentes?.length){
            const ids=qmExistentes.map(q=>q.id);
            await sb.from('quincena_detalle').delete().in('quincena_mensajero_id',ids);
            await sb.from('quincena_mensajeros').delete().eq('quincena_id',quin.id);
          }
          // Guardar todos los mensajeros con sus totales (sin filtro de quincena)
          let guardados=0;
          for(const [key,m] of Object.entries(mensajerosMap)){
            // Tomar TODAS las entregas del mensajero en el archivo sin filtrar por quincena
            const subDf=df.filter(r=>
              (m.id ? r.mensajeroId===m.id : r.nombreReal===m.nombre)
            );
            if(!subDf.length) continue;

            // Resumen día a día
            const diasSet={};
            subDf.forEach(r=>{
              const fd=r.fecha instanceof Date?r.fecha:new Date(r.fecha);
              const d=fd.getDate();
              if(!diasSet[d])diasSet[d]={dia:d,entregas:0,valor:0,fecha:fd};
              diasSet[d].entregas++;
              diasSet[d].valor+=r.valor;
            });
            const totalEnt=Object.values(diasSet).reduce((s,d)=>s+d.entregas,0);
            const totalBruto=Object.values(diasSet).reduce((s,d)=>s+d.valor,0);

            // Insertar mensajero en quincena (ya limpiamos antes así que siempre es insert)
            const payload={
              quincena_id:quin.id,
              nombre_display:m.nombre,
              correo_xcargo:m.correo||null,
              total_entregas:totalEnt,
              total_bruto:totalBruto,
              en_bd:!!m.id,
            };
            if(m.id) payload.mensajero_id=m.id;

            const{data:qmNew,error:qmErr}=await sb.from('quincena_mensajeros').insert(payload).select('id').single();
            if(qmErr){console.error('Error insertando mensajero quincena:',m.nombre,qmErr);continue;}
            const qmId=qmNew?.id;

            // Guardar detalle día a día
            if(qmId){
              await sb.from('quincena_detalle').delete().eq('quincena_mensajero_id',qmId);
              const detalles=Object.values(diasSet).map(d=>({
                quincena_mensajero_id:qmId,
                dia:d.dia,
                fecha:d.fecha.toISOString().slice(0,10),
                entregas:d.entregas,
                valor:d.valor,
              }));
              if(detalles.length) await sb.from('quincena_detalle').insert(detalles);
            }
            guardados++;
          }

          // Actualizar totales de la quincena
          await sb.from('quincenas').update({
            total_mensajeros:guardados,
            total_entregas:df.length,
          }).eq('id',quin.id);

          toast(`Quincena ${quinNombre} guardada · ${guardados} mensajeros`,'ok');
        }
      }catch(errQ){
        console.error('Error guardando quincena:',errQ);
        // No bloquear el flujo si falla el guardado
      }
    }

    document.getElementById('liqFileLabel').textContent=
      '✓ '+file.name+' ('+df.length.toLocaleString()+' entregas · '+mensajeros.length+' operadores)';
    document.getElementById('liqStep2').style.display='block';

    // Actualizar selector
    const sel=document.getElementById('liqMensajero');
    if(sel)sel.innerHTML=mensajeros.map(m=>
      `<option value="${esc(m.nombre)}" ${m.enBD?'':'style="color:#f59e0b"'}>
        ${esc(m.nombre)}${m.enBD?'':' ⚠️ no está en BD'}
      </option>`
    ).join('');

    const sinBD=mensajeros.filter(m=>!m.enBD).length;
    toast('Archivo cargado · '+mensajeros.length+' operadores'+(sinBD?` · ${sinBD} sin match en BD`:''),'ok');
  }catch(e){
    document.getElementById('liqFileLabel').textContent='Error: '+e.message;
    toast('Error: '+e.message,'er');
  }
}


async function liqPreview(){
  const mensajeroNombre=document.getElementById('liqMensajero')?.value;
  const mes=parseInt(document.getElementById('liqMes')?.value);
  const año=parseInt(document.getElementById('liqAño')?.value);
  const quincena=document.getElementById('liqQuincena')?.value;
  if(!mensajeroNombre||!mes||!año||!quincena){toast('Completa todos los campos','er');return;}

  const rango=rangoQuincena(mes,año,quincena);
  const df=S._liqData.df;

  // Obtener mensajeroId desde el mapa cargado en liqHandleFile
  const mensInfo=Object.values(S._liqData.mensajerosMap||{}).find(m=>m.nombre===mensajeroNombre);
  const mensDBId=mensInfo?.id||null;

  // Filtrar entregas del mensajero en el período
  const sub=df.filter(r=>{
    if(r.nombreReal!==mensajeroNombre)return false;
    const fd=r.fecha instanceof Date?r.fecha:new Date(r.fecha);
    return fd>=rango.desde&&fd<=rango.hasta;
  });

  // Resumen por día
  const diasSet={};
  sub.forEach(r=>{
    const fd=r.fecha instanceof Date?r.fecha:new Date(r.fecha);
    const d=fd.getDate();
    if(!diasSet[d])diasSet[d]={dia:d,paquetes:0,valor:0};
    diasSet[d].paquetes++;
    diasSet[d].valor+=r.valor;
  });
  const diasRango=[];
  for(let d=new Date(rango.desde);d<=rango.hasta;d.setDate(d.getDate()+1))
    diasRango.push(d.getDate());
  const resumen=diasRango.map(d=>diasSet[d]||{dia:d,paquetes:0,valor:0});
  const totalBruto=resumen.reduce((s,r)=>s+r.valor,0);

  // Descuentos pendientes si hay match en BD
  let descuentosPend=[];
  if(mensDBId){
    const{data:descs}=await sb.from('descuentos')
      .select('id,concepto,valor,tipo,numero_guia,fecha_evento')
      .eq('mensajero_id',mensDBId)
      .eq('mes_quincena',mes).eq('año_quincena',año).eq('quincena',quincena)
      .eq('aplicado',false);
    descuentosPend=descs||[];
  }
  const totalDescuentos=descuentosPend.reduce((s,d)=>s+d.valor,0);
  const totalNeto=totalBruto-totalDescuentos;

  S._liqPreview={mensajero:mensajeroNombre,mes,año,quincena,resumen,totalBruto,totalDescuentos,totalNeto,descuentosPend,mensDBId};

  const area=document.getElementById('liqPreviewArea');
  if(!area)return;
  area.style.display='block';

  let html=`
    <div class="sec-title">Resumen · ${MESES_ES[mes]} ${año} · ${quincena}</div>
    <div style="font-size:var(--fss);color:var(--tx3);margin-bottom:10px">${fmtRango(mes,año,quincena)}</div>
  `;

  if(!mensDBId){
    html+=`<div style="background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:var(--r2);padding:10px 12px;margin-bottom:10px;font-size:var(--fss);color:var(--amb)">
      ⚠️ Este operador no tiene match en BD. Puedes ver el resumen pero no se guardará el recibo.
    </div>`;
  }

  html+=`
    <div class="stat-row">
      <div class="stat"><div class="stat-n" style="color:var(--acc)">${sub.length}</div><div class="stat-l">Entregas</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--grn);font-size:clamp(13px,3.5vw,15px)">${fmtCOP(totalBruto)}</div><div class="stat-l">Bruto</div></div>
      <div class="stat"><div class="stat-n" style="color:${descuentosPend.length?'var(--red)':'var(--tx3)'};font-size:clamp(13px,3.5vw,15px)">${fmtCOP(totalDescuentos)}</div><div class="stat-l">Descuentos</div></div>
    </div>
    <div style="background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:var(--r2);padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-weight:600">Total neto</span>
      <span style="font-weight:700;font-size:clamp(18px,5vw,22px);font-family:var(--mo);color:var(--grn)">${fmtCOP(totalNeto)}</span>
    </div>
    <div style="max-height:240px;overflow-y:auto;margin-bottom:12px">
      <table class="tbl">
        <thead><tr><th>Día</th><th>Entregas</th><th>Valor</th></tr></thead>
        <tbody>
          ${resumen.filter(r=>r.paquetes>0).map(r=>`
            <tr>
              <td>${r.dia}</td>
              <td style="font-family:var(--mo)">${r.paquetes}</td>
              <td style="font-family:var(--mo);color:var(--grn)">${fmtCOP(r.valor)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;

  if(descuentosPend.length){
    html+=`<div class="sec-title" style="color:var(--red)">Descuentos a aplicar (${descuentosPend.length})</div>`;
    descuentosPend.forEach(d=>{
      html+=`<div style="background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);border-radius:var(--r2);padding:8px 12px;margin-bottom:6px;font-size:var(--fss)">
        <div style="font-weight:500">${esc(d.concepto)}</div>
        <div style="color:var(--tx2)">${d.numero_guia?'Guía: '+esc(d.numero_guia)+' · ':''}<span style="color:var(--red);font-family:var(--mo)">${fmtCOP(d.valor)}</span></div>
      </div>`;
    });
  }

  html+=`
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-o btn-s" style="flex:1" onclick="go('nomina-desc-individual')">+ Descuento</button>
      <button class="btn btn-g" style="flex:2" ${!mensDBId?'disabled':''}  onclick="confirmarLiquidacion()">Generar recibo ✓</button>
    </div>
  `;
  area.innerHTML=html;
}

async function confirmarLiquidacion(){
  const p=S._liqPreview;
  if(!p){toast('Sin datos para liquidar','er');return;}
  if(!p.mensDBId){toast('Mensajero no encontrado en base de datos.','wa');return;}

  dialog(
    'Confirmar liquidación',
    `¿Generar recibo para ${p.mensajero}?\n${MESES_ES[p.mes]} ${p.año} · ${p.quincena}\nTotal neto: ${fmtCOP(p.totalNeto)}`,
    '',
    [
      {l:'Cancelar',fn:closeDlg},
      {l:'Confirmar ✓',c:'btn-g',fn:async()=>{
        closeDlg();
        setP(`<div class="ld"><div class="sp"></div><p style="color:var(--tx2)">Guardando y generando PDF...</p></div>`);
        try{
          // 1. Crear/obtener quincena
          const quinNombre=`${MESES_ES[p.mes]} ${p.año} · ${p.quincena}`;
          let quin=null;
          {
            const{data:existeQ}=await sb.from('quincenas').select('id').eq('mes',p.mes).eq('año',p.año).eq('quincena',p.quincena).maybeSingle();
            if(existeQ){quin=existeQ;}
            else{const{data:nQ}=await sb.from('quincenas').insert({mes:p.mes,año:p.año,quincena:p.quincena,nombre:quinNombre,archivo_nombre:S._liqData?.archivo||null}).select('id').single();quin=nQ;}
          }

          // 2. Crear/actualizar entrada del mensajero en quincena_mensajeros
          let qmEntry=null;
          if(quin?.id&&p.mensDBId){
            let{data:qm}=await sb.from('quincena_mensajeros').select('id').eq('quincena_id',quin.id).eq('mensajero_id',p.mensDBId).maybeSingle();
            if(qm){
              await sb.from('quincena_mensajeros').update({nombre_display:p.mensajero,total_entregas:p.resumen.reduce((s,r)=>s+r.paquetes,0),total_bruto:p.totalBruto,en_bd:true}).eq('id',qm.id);
            } else {
              const{data:nQm}=await sb.from('quincena_mensajeros').insert({quincena_id:quin.id,mensajero_id:p.mensDBId,nombre_display:p.mensajero,correo_xcargo:Object.values(S._liqData?.mensajerosMap||{}).find(m=>m.nombre===p.mensajero)?.correo||null,total_entregas:p.resumen.reduce((s,r)=>s+r.paquetes,0),total_bruto:p.totalBruto,en_bd:true}).select('id').single();
              qm=nQm;
            }
            qmEntry=qm;

            // Guardar detalle día a día
            if(qm?.id){
              await sb.from('quincena_detalle').delete().eq('quincena_mensajero_id',qm.id);
              const detalles=p.resumen.filter(r=>r.paquetes>0).map(r=>({
                quincena_mensajero_id:qm.id,
                dia:r.dia,
                fecha:new Date(p.año,p.mes-1,r.dia).toISOString().slice(0,10),
                entregas:r.paquetes,
                valor:r.valor,
              }));
              if(detalles.length) await sb.from('quincena_detalle').insert(detalles);
            }

            // Actualizar totales de la quincena
            const{count:totalMens}=await sb.from('quincena_mensajeros').select('id',{count:'exact',head:true}).eq('quincena_id',quin.id);
            const{data:totales}=await sb.from('quincena_mensajeros').select('total_entregas').eq('quincena_id',quin.id);
            const totalEntr=totales?.reduce((s,m)=>s+Number(m.total_entregas||0),0)||0;
            await sb.from('quincenas').update({total_mensajeros:totalMens||0,total_entregas:totalEntr}).eq('id',quin.id);
          }

          // 3. Insertar liquidación formal
          const{data:liq,error:lErr}=await sb.from('liquidaciones').insert({
            mensajero_id:p.mensDBId,
            mes:p.mes, año:p.año, quincena:p.quincena,
            total_bruto:p.totalBruto,
            total_descuentos:p.totalDescuentos,
            total_neto:p.totalNeto,
            created_by:S.user.id
          }).select().single();
          if(lErr)throw lErr;

          // 2. Guardar detalle día a día
          const detalles=p.resumen.filter(r=>r.paquetes>0).map(r=>{
            const fecha=new Date(p.año,p.mes-1,r.dia);
            return{
              liquidacion_id:liq.id,
              dia:r.dia,
              fecha:fecha.toISOString().slice(0,10),
              entregas:r.paquetes,
              valor:r.valor,
            };
          });
          if(detalles.length) await sb.from('liquidaciones_detalle').insert(detalles);

          // 3. Aplicar descuentos pendientes
          if(p.descuentosPend.length){
            await sb.rpc('aplicar_descuentos_liquidacion',{
              p_liquidacion_id:liq.id,
              p_mensajero_id:p.mensDBId,
              p_mes:p.mes, p_año:p.año, p_quincena:p.quincena
            });
          }

          // 3. Obtener datos del mensajero para el recibo
          const{data:mens}=await sb.from('mensajeros')
            .select('nombre_completo,num_documento,telefono,placa')
            .eq('id',p.mensDBId).single();

          // 4. Generar PDF
          generarReciboPDF(p, mens, liq.id);

          toast('Recibo generado y descargado ✓','ok');
          S._liqPreview=null;
          go('nomina-home');
        }catch(e){
          toast('Error: '+e.message,'er');
          go('nomina-liquidar');
        }
      }}
    ]
  );
}

function generarReciboPDF(p, mens, liqId){
  // Número de recibo: CC-documento-MesAño-Quincena
  const docNum=mens?.num_documento||'SIN-CC';
  const reciboNum=`CC${docNum}-${String(p.mes).padStart(2,'0')}${p.año}-${p.quincena==='Primera quincena'?'Q1':'Q2'}`;

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});

  const PW=210, PH=297;
  const ML=15, MR=15, MT=15;
  const CW=PW-ML-MR; // ancho útil
  let y=MT;

  // ── Colores ──
  const DARK=[15,23,42];
  const GRAY=[100,116,139];
  const LIGHT=[241,245,249];
  const GREEN=[16,185,129];
  const RED=[239,68,68];
  const BLUE=[59,130,246];
  const WHITE=[255,255,255];

  // ── Helpers ──
  const setFont=(size,style='normal',color=DARK)=>{
    doc.setFontSize(size);
    doc.setFont('helvetica',style);
    doc.setTextColor(...color);
  };
  const rect=(x,y,w,h,color,rounded=2)=>{
    doc.setFillColor(...color);
    doc.roundedRect(x,y,w,h,rounded,rounded,'F');
  };
  const line=(x1,y1,x2,y2,color=LIGHT,lw=0.3)=>{
    doc.setDrawColor(...color);
    doc.setLineWidth(lw);
    doc.line(x1,y1,x2,y2);
  };
  const fmtNum=(v)=>'$'+Number(v||0).toLocaleString('es-CO');

  // ══════════════════════════════════
  // ENCABEZADO
  // ══════════════════════════════════
  rect(0,0,PW,38,DARK,0);
  setFont(18,'bold',WHITE);
  doc.text('STC Express',ML,y+10);
  setFont(9,'normal',[148,163,184]);
  doc.text('Sistema de Mensajería · Suba, Bogotá',ML,y+17);

  // Etiqueta RECIBO DE PAGO
  doc.setFillColor(...BLUE);
  doc.roundedRect(PW-MR-42,y+4,42,13,2,2,'F');
  setFont(8,'bold',WHITE);
  doc.text('RECIBO DE PAGO',PW-MR-42+21,y+12,{align:'center'});

  // Número de recibo
  setFont(7,'normal',[148,163,184]);
  doc.text(`#${reciboNum}`,PW-MR-42+21,y+20,{align:'center'});

  y=42;

  // ══════════════════════════════════
  // DATOS DEL MENSAJERO
  // ══════════════════════════════════
  rect(ML,y,CW,28,[30,41,59],2);

  setFont(11,'bold',WHITE);
  doc.text(mens?.nombre_completo||p.mensajero, ML+4, y+8);

  setFont(8,'normal',[148,163,184]);
  const infoItems=[];
  if(mens?.num_documento) infoItems.push(`CC ${mens.num_documento}`);
  if(mens?.telefono)       infoItems.push(`Tel: ${mens.telefono}`);
  if(mens?.placa)          infoItems.push(`Placa: ${mens.placa}`);
  doc.text(infoItems.join('   '), ML+4, y+15);

  setFont(8,'normal',[148,163,184]);
  const rango=rangoQuincena(p.mes,p.año,p.quincena);
  const opts={day:'2-digit',month:'long',year:'numeric'};
  const rangoStr=rango.desde.toLocaleDateString('es-CO',opts)+' – '+rango.hasta.toLocaleDateString('es-CO',opts);
  doc.text(`Período: ${rangoStr}`, ML+4, y+22);

  // Definir esQ1 aquí para usarlo en el badge y más adelante en el texto legal
  const esQ1=p.quincena==='Primera quincena'||p.quincena==='Q1';

  // Badge quincena
  const quinLabel=`${MESES_ES[p.mes]} ${p.año} · ${esQ1?'Q1':'Q2'}`;
  doc.setFillColor(...BLUE);
  doc.roundedRect(PW-MR-45,y+4,45,13,2,2,'F');
  doc.setFontSize(7.5);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
  doc.text(quinLabel,PW-MR-45+22.5,y+12,{align:'center'});

  y+=33;

  // ══════════════════════════════════
  // RESUMEN TOTALES
  // ══════════════════════════════════
  const colW=CW/3;
  const totales=[
    {label:'Total Bruto',    value:fmtNum(p.totalBruto),    color:GREEN},
    {label:'Descuentos',     value:fmtNum(p.totalDescuentos), color:p.totalDescuentos>0?RED:GRAY},
    {label:'TOTAL NETO',     value:fmtNum(p.totalNeto),     color:GREEN, bold:true},
  ];
  totales.forEach((t,i)=>{
    const x=ML+(i*colW);
    const bg=t.bold?[16,185,129]:LIGHT;
    const textCol=t.bold?WHITE:DARK;
    rect(x+(i>0?2:0), y, colW-(i>0?2:0), 20, bg, 2);
    setFont(7,'normal', t.bold?[209,250,229]:GRAY);
    doc.text(t.label, x+(i>0?2:0)+colW/2, y+7, {align:'center'});
    setFont(t.bold?11:10,'bold', t.bold?WHITE:t.color);
    doc.text(t.value, x+(i>0?2:0)+colW/2, y+15, {align:'center'});
  });

  y+=25;

  // ══════════════════════════════════
  // DETALLE DÍA A DÍA
  // ══════════════════════════════════
  setFont(9,'bold',DARK);
  doc.text('Detalle de entregas',ML,y);
  y+=5;

  // Cabecera tabla
  rect(ML,y,CW,7,DARK,1);
  setFont(7,'bold',WHITE);
  doc.text('Día',ML+3,y+4.5);
  doc.text('Fecha',ML+18,y+4.5);
  doc.text('Entregas',ML+55,y+4.5,{align:'center'});
  doc.text('Valor',PW-MR-3,y+4.5,{align:'right'});
  y+=7;

  const diasConEntregas=p.resumen.filter(r=>r.paquetes>0);
  diasConEntregas.forEach((r,i)=>{
    const bg=i%2===0?WHITE:[248,250,252];
    rect(ML,y,CW,6,bg,0);
    line(ML,y+6,PW-MR,y+6);

    // Construir fecha completa del día
    const fechaDia=new Date(p.año,p.mes-1,r.dia);
    const fechaStr=fechaDia.toLocaleDateString('es-CO',{weekday:'short',day:'2-digit',month:'short'});

    setFont(7,'normal',DARK);
    doc.text(String(r.dia).padStart(2,'0'),ML+3,y+4.2);
    doc.text(fechaStr,ML+18,y+4.2);
    setFont(7,'bold',BLUE);
    doc.text(String(r.paquetes),ML+55,y+4.2,{align:'center'});
    setFont(7,'normal',GREEN);
    doc.text(fmtNum(r.valor),PW-MR-3,y+4.2,{align:'right'});
    y+=6;

    // Nueva página si hace falta
    if(y>PH-50){
      doc.addPage();
      y=MT;
    }
  });

  // Total entregas
  rect(ML,y,CW,7,[30,41,59],1);
  setFont(7,'bold',WHITE);
  const totalEntregas=diasConEntregas.reduce((s,r)=>s+r.paquetes,0);

  doc.text(String(totalEntregas),ML+55,y+4.8,{align:'center'});
  doc.text(fmtNum(p.totalBruto),PW-MR-3,y+4.8,{align:'right'});
  y+=12;

  // ══════════════════════════════════
  // DESCUENTOS (si hay)
  // ══════════════════════════════════
  if(p.descuentosPend.length){
    if(y>PH-60){doc.addPage();y=MT;}

    setFont(9,'bold',DARK);
    doc.text('Descuentos aplicados',ML,y);
    y+=5;

    rect(ML,y,CW,7,[60,20,20],1);
    setFont(7,'bold',WHITE);
    doc.text('Concepto',ML+3,y+4.5);
    doc.text('Guía',ML+80,y+4.5);
    doc.text('Valor',PW-MR-3,y+4.5,{align:'right'});
    y+=7;

    p.descuentosPend.forEach((d,i)=>{
      const bg=i%2===0?[255,248,248]:[255,240,240];
      rect(ML,y,CW,6,bg,0);

      setFont(7,'normal',DARK);
      doc.text(d.concepto.slice(0,45),ML+3,y+4.2);
      setFont(7,'normal',GRAY);
      doc.text(d.numero_guia||'—',ML+80,y+4.2);
      setFont(7,'bold',RED);
      doc.text(fmtNum(d.valor),PW-MR-3,y+4.2,{align:'right'});
      y+=6;
    });
    y+=4;
  }

  // ══════════════════════════════════
  // TOTAL NETO (caja final destacada)
  // ══════════════════════════════════
  if(y>PH-45){doc.addPage();y=MT;}
  rect(ML,y,CW,18,GREEN,3);
  setFont(8,'normal',WHITE);
  doc.text('TOTAL A PAGAR',ML+CW/2,y+6,{align:'center'});
  setFont(16,'bold',WHITE);
  doc.text(fmtNum(p.totalNeto),ML+CW/2,y+14,{align:'center'});
  y+=22;

  // ── Datos bancarios ──
  if(mens?.banco||mens?.num_cuenta){
    if(y>PH-30){doc.addPage();y=MT;}
    doc.setFillColor(248,255,250);
    doc.roundedRect(ML,y,CW,15,2,2,'F');
    doc.setDrawColor(16,185,129);doc.setLineWidth(0.4);
    doc.roundedRect(ML,y,CW,15,2,2,'S');
    setFont(7,'bold',DARK);
    doc.text('Datos para consignacion',ML+3,y+5.5);
    setFont(7,'normal',GRAY);
    const tipoCta=mens.tipo_cuenta?` · Cta ${mens.tipo_cuenta}`:'';
    doc.text(`${mens.banco||'—'}${tipoCta}`,ML+3,y+11);
    setFont(8,'bold',[0,120,60]);
    doc.text(mens.num_cuenta||'—',PW-MR-3,y+11,{align:'right'});
    y+=19;
  }

  // ── Texto legal ──
  if(y>PH-55){doc.addPage();y=MT;}

  // Determinar quincena en texto
  const quinTexto=esQ1?'PRIMERA QUINCENA':'SEGUNDA QUINCENA';
  const mesTexto=(MESES_ES[p.mes]||'').toUpperCase();
  const valorLetras=numALetras(p.totalNeto);

  const textoLegal=[
    `HE RECIBIDO DE LA EMPRESA STC EXPRESS MENSAJERIA SAS, LA SUMA DE`,
    `${valorLetras} ($${Number(p.totalNeto).toLocaleString('es-CO')}),`,
    `CORRESPONDIENTE A LA ${quinTexto} DEL MES DE ${mesTexto} DE ${p.año}.`,
    '',
    `DE NO RECIBIR NINGUNA NOVEDAD POR PARTE DEL MENSAJERO DURANTE LOS 2 DIAS HABILES`,
    `DE GENERACION DE ESTE RECIBO, SE DA POR ENTENDIDO QUE SE RECIBIO CONFORME.`,
  ];

  doc.setFillColor(248,248,255);
  doc.roundedRect(ML,y,CW,30,2,2,'F');
  doc.setDrawColor(200,200,220);doc.setLineWidth(0.3);
  doc.roundedRect(ML,y,CW,30,2,2,'S');
  setFont(6.5,'normal',[40,40,80]);
  let yLegal=y+5;
  textoLegal.forEach(linea=>{
    if(linea) doc.text(linea,ML+3,yLegal);
    yLegal+=4;
  });
  y+=34;

  // ── Línea de firma ──
  if(y>PH-20){doc.addPage();y=MT;}
  const firmaCedula=mens?.num_documento?`CC ${mens.num_documento}`:'';
  setFont(7,'normal',GRAY);
  doc.text('Firma: _________________________________',ML,y+8);
  doc.text(`${mens?.nombre_completo||p.mensajero}`,ML,y+14);
  if(firmaCedula){doc.text(firmaCedula,ML,y+18);}
  doc.text(`Fecha: ______ / ______ / ________`,PW-MR-3,y+8,{align:'right'});

  // ══════════════════════════════════
  // PIE DE PÁGINA
  // ══════════════════════════════════
  const yFoot=PH-12;
  line(ML,yFoot-3,PW-MR,yFoot-3);
  setFont(6,'normal',GRAY);
  const ahora=new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  doc.text(`Generado el ${ahora} · STC Express Mensajería`,ML,yFoot);
  doc.text(`Recibo #${reciboNum}`,PW-MR,yFoot,{align:'right'});

  // ── Descargar ──
  const nombreLimpio=(mens?.nombre_completo||p.mensajero).replace(/\s+/g,'_');
  doc.save(`Recibo_${nombreLimpio}_${MESES_ES[p.mes]}${p.año}_${p.quincena}.pdf`);
}

function toggleGuia(){
  const tipo=document.getElementById('diTipo')?.value;
  const row=document.getElementById('diGuiaRow');
  if(row)row.style.display=tipo==='paquete_perdido'?'block':'none';
}

async function guardarDescIndividual(){
  const mensId=document.getElementById('diMens')?.value;
  const tipo=document.getElementById('diTipo')?.value;
  const guia=document.getElementById('diGuia')?.value?.trim()||null;
  const concepto=document.getElementById('diConcepto')?.value?.trim();
  const valor=parseInt(document.getElementById('diValor')?.value);
  const fecha=document.getElementById('diFecha')?.value;
  const notas=document.getElementById('diNotas')?.value?.trim()||null;

  if(!mensId||!concepto||!valor||!fecha){toast('Completa los campos obligatorios','er');return;}
  if(tipo==='paquete_perdido'&&!guia){toast('La guía es obligatoria para paquete perdido','er');return;}
  if(isNaN(valor)||valor<=0){toast('El valor debe ser mayor a 0','er');return;}

  try{
    const{error}=await sb.from('descuentos').insert({
      mensajero_id:mensId, tipo, concepto,
      numero_guia:tipo==='paquete_perdido'?guia:null,
      valor, fecha_evento:fecha, notas, created_by:S.user.id
    });
    if(error)throw error;
    toast('Descuento registrado ✓','ok');
    go('nomina-descuentos');
  }catch(e){
    toast('Error: '+e.message,'er');
  }
}

async function pgDescGrupal(){
  setBar('Descuento grupal','Nómina');
  setP(loader());
  const{data:mensajeros}=await sb.from('mensajeros').select('id,nombre_completo').eq('activo',true).order('nombre_completo');

  setP(`
    <div style="display:flex;flex-direction:column;gap:10px">
      <div>
        <label>Concepto *</label>
        <input class="inp" id="dgConcepto" placeholder="Ej: Daño en bodega / Merma caja">

      </div>
      <div>
        <label>Fecha del evento *</label>
        <input class="inp" type="date" id="dgFecha" value="${todayISO()}" max="${todayISO()}" onchange="dgRecalc()">
      </div>
      <div id="dgQuincenaInfo" style="background:var(--bg);border-radius:var(--r2);padding:10px 12px;font-size:var(--fss);color:var(--tx3)"></div>

        <label>Notas</label>

      <div style="display:flex;gap:8px;margin-bottom:6px">
        <button class="btn btn-o btn-s" style="flex:1;font-size:var(--fss)" onclick="dgSelectAll(true)">Todos</button>
        <button class="btn btn-o btn-s" style="flex:1;font-size:var(--fss)" onclick="dgSelectAll(false)">Ninguno</button>
      </div>
      <div id="dgMensList" style="max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:4px">
        ${(mensajeros||[]).map(m=>`
          <label style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border-radius:var(--r2);cursor:pointer">
            <input type="checkbox" id="dgm_${m.id}" value="${m.id}" onchange="dgRecalc()" style="width:16px;height:16px;flex-shrink:0">
            <span style="flex:1;font-size:var(--fsm)">${esc(m.nombre_completo)}</span>
            <span style="font-family:var(--mo);font-size:var(--fss);color:var(--tx3)" id="dgv_${m.id}">—</span>
          </label>`).join('')}
      </div>

      <div style="background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:var(--r2);padding:10px 12px;font-size:var(--fss)" id="dgResumen">
        Selecciona mensajeros para ver el reparto
      </div>

      <button class="btn btn-d btn-w" onclick="guardarDescGrupal()">Guardar y distribuir</button>
    </div>
  `);

  // Trigger inicial
  document.getElementById('dgFecha').dispatchEvent(new Event('change'));
  dgRecalc();
}

function dgSelectAll(val){
  document.querySelectorAll('#dgMensList input[type=checkbox]').forEach(cb=>cb.checked=val);
  dgRecalc();
}

function dgRecalc(){
  const fecha=document.getElementById('dgFecha')?.value;
  const valor=parseInt(document.getElementById('dgValor')?.value)||0;
  const checks=[...document.querySelectorAll('#dgMensList input[type=checkbox]:checked')];
  const n=checks.length;
  const valorUno=n>0?Math.floor(valor/n):0;
  const resto=n>0?valor-(valorUno*n):0;

  // Actualizar quincena info
  if(fecha){
    const q=calcQuincena(fecha);
    const qi=document.getElementById('dgQuincenaInfo');
    if(qi)qi.innerHTML=`📅 Cae en <strong>${q.quincena}</strong> · ${MESES_ES[q.mes]} ${q.año}<br><span style="color:var(--tx3)">${fmtRango(q.mes,q.año,q.quincena)}</span>`;
  }

  // Limpiar todos los valores primero
  document.querySelectorAll('#dgMensList input[type=checkbox]').forEach((cb,i)=>{
    const span=document.getElementById('dgv_'+cb.value);
    if(span)span.textContent='—';
  });

  // Asignar valores a los seleccionados
  checks.forEach((cb,i)=>{
    const v=i===0?valorUno+resto:valorUno;
    const span=document.getElementById('dgv_'+cb.value);
    if(span)span.textContent=v>0?fmtCOP(v):'—';
  });

  const res=document.getElementById('dgResumen');
  if(res){
    if(n===0)res.textContent='Selecciona mensajeros para ver el reparto';
    else res.innerHTML=`<strong>${n} mensajeros</strong> · ${fmtCOP(valorUno)} c/u${resto>0?` (1 paga ${fmtCOP(valorUno+resto)})`:''}`;
  }
}

async function guardarDescGrupal(){
  const concepto=document.getElementById('dgConcepto')?.value?.trim();
  const valor=parseInt(document.getElementById('dgValor')?.value);
  const fecha=document.getElementById('dgFecha')?.value;
  const notas=document.getElementById('dgNotas')?.value?.trim()||null;
  const checks=[...document.querySelectorAll('#dgMensList input[type=checkbox]:checked')];

  if(!concepto||!valor||!fecha){toast('Completa concepto, valor y fecha','er');return;}
  if(checks.length===0){toast('Selecciona al menos un mensajero','er');return;}

  const n=checks.length;
  const valorUno=Math.floor(valor/n);
  const resto=valor-(valorUno*n);
  const q=calcQuincena(fecha);

  dialog(
    'Confirmar descuento grupal',
    `${concepto}\n${fmtCOP(valor)} distribuido entre ${n} mensajeros\n${q.quincena} · ${MESES_ES[q.mes]} ${q.año}`,
    '',
    [
      {l:'Cancelar',fn:closeDlg},
      {l:'Guardar y distribuir',c:'btn-d',fn:async()=>{
        closeDlg();
        try{
          // Insertar descuento grupal
          const{data:grp,error:gErr}=await sb.from('descuentos_grupales').insert({
            concepto,valor_total:valor,fecha_evento:fecha,
            mes_quincena:q.mes,año_quincena:q.año,quincena:q.quincena,
            notas,created_by:S.user.id
          }).select().single();
          if(gErr)throw gErr;

          // Insertar participantes
          const participantes=checks.map((cb,i)=>({
            descuento_grupal_id:grp.id,
            mensajero_id:cb.value,
            valor_asignado:i===0?valorUno+resto:valorUno
          }));
          const{error:pErr}=await sb.from('descuentos_grupales_participantes').insert(participantes);
          if(pErr)throw pErr;

          // Confirmar (genera descuentos individuales)
          const{error:cErr}=await sb.rpc('confirmar_descuento_grupal',{p_id:grp.id,p_user:S.user.id});
          if(cErr)throw cErr;

          toast(`Descuento distribuido entre ${n} mensajeros ✓`,'ok');
          go('nomina-descuentos');
        }catch(e){
          toast('Error: '+e.message,'er');
        }
      }}
    ]
  );
}

    sb.from('mensajeros').select('nombre_completo,usuario_xcargo_prestado').eq('activo',true).not('usuario_xcargo_prestado','is',null),
  ]);

  // Mapa de correo prestado → nombre del mensajero que lo usa
  const enUsoMap={};
  (enUsoRaw||[]).forEach(m=>{
    if(m.usuario_xcargo_prestado) enUsoMap[m.usuario_xcargo_prestado.toLowerCase()]=m.nombre_completo;
  });

  const activos=(mensajeros||[]).filter(m=>m.activo);
  const retirados=(mensajeros||[]).filter(m=>!m.activo);

  // Búsqueda en cliente
  const busqId='uBusq_'+Date.now();
  let h=`

            <div class="cs">${m.num_documento?'CC '+esc(m.num_documento)+' · ':''}${m.telefono?'📞 '+esc(m.telefono):'Sin teléfono'}${m.placa?' · 🏍 '+esc(m.placa):''}</div>

  // ── Tab préstamos ──
  h+=`<div id="tabContentPrestamos" style="display:none">`;
  if(!prestamos?.length){
    h+=`<p class="empty">Sin usuarios de préstamo registrados</p>`;
  } else {
    (prestamos||[]).forEach(p=>{
      const asignadoA=enUsoMap[p.usuario_xcargo?.toLowerCase()];
      const enUso=!!asignadoA;
      h+=`<div class="card" style="cursor:default">
        <div class="card-row">
          <div class="ci" style="background:rgba(59,130,246,.12);color:var(--acc)">🔑</div>

            <div class="ct">${esc(p.nombre)}</div>

            ${enUso?`<div style="font-size:var(--fss);color:var(--amb);margin-top:2px">→ ${esc(asignadoA)}</div>`:''}
          </div>

            <span class="b ${enUso?'b-am':'b-gr'}">${enUso?'En uso':'Disponible'}</span>
            <button class="btn btn-o" style="font-size:10px;padding:3px 8px;height:auto" onclick="verClavePrestamo('${p.id}','${esc(p.nombre)}')">${p.clave_enc?'Ver clave':'🔑 Sin clave'}</button>

  // ── Tab retirados ──
  h+=`<div id="tabContentRetirados" style="display:none">`;
  if(!retirados.length){
    h+=`<p class="empty">Sin mensajeros retirados</p>`;
  } else {
    retirados.forEach(m=>{
      h+=`<div class="card usuario-card" data-search="${esc((m.nombre_completo+' '+(m.num_documento||'')).toLowerCase())}" onclick="S._userId='${m.id}';S._userNombre='${esc(m.nombre_completo)}';go('usuario-detalle')">
        <div class="card-row">
          <div class="ci" style="background:rgba(100,116,139,.12);color:var(--tx3);font-weight:700;font-size:15px;font-family:var(--mo)">
            ${m.placa?esc(m.placa.slice(0,3)):'👤'}
          </div>
          <div style="flex:1;min-width:0">
            <div class="ct" style="color:var(--tx2)">${esc(m.nombre_completo)}</div>
            <div class="cs">${m.num_documento?'CC '+esc(m.num_documento)+' · ':''}${m.placa?'🏍 '+esc(m.placa):''}</div>
            ${m.fecha_retiro?`<div style="font-size:var(--fss);color:var(--tx3)">Retirado: ${fmtDate(m.fecha_retiro)}</div>`:''}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
            <span class="b b-gy">Retirado</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;color:var(--tx3)"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      </div>`;
    });
  }
  h+=`</div></div>`;

  // Botón cargar Excel
  h+=`
    <div style="margin-top:16px;padding:12px 14px;background:var(--bg);border-radius:var(--r);border:1px dashed var(--brd2)">
      <div style="font-size:var(--fsm);font-weight:600;margin-bottom:6px">📂 Carga masiva desde Excel</div>
      <div style="font-size:var(--fss);color:var(--tx3);margin-bottom:10px">Sube el formato de usuarios para importar mensajeros y usuarios de préstamo</div>
      <div class="file-drop" onclick="document.getElementById('usuFileInput').click()"
           ondragover="event.preventDefault();this.classList.add('drag')"
           ondragleave="this.classList.remove('drag')"
           ondrop="event.preventDefault();this.classList.remove('drag');usuHandleFile(event.dataTransfer.files[0])">
        <div style="font-size:24px;margin-bottom:4px">📋</div>
        <p style="font-weight:600;font-size:var(--fsm)">Selecciona el Excel de usuarios</p>
        <p style="font-size:var(--fss);color:var(--tx3)">Hojas: MENSAJEROS · USUARIOS DISPO PARA PRESTAMO</p>
      </div>
      <input type="file" id="usuFileInput" accept=".xlsx,.xls" style="display:none" onchange="usuHandleFile(this.files[0])">
      <div id="usuImportResult"></div>
    </div>
  `;

  setP(h);
  // Guardar datos para filtro
  window._mensajerosData=mensajeros||[];
}

function switchTabUsuarios(tab){
  document.getElementById('tabContentActivos').style.display=tab==='activos'?'block':'none';
  document.getElementById('tabContentPrestamos').style.display=tab==='prestamos'?'block':'none';
  document.getElementById('tabContentRetirados').style.display=tab==='retirados'?'block':'none';
  document.getElementById('tabActivos').classList.toggle('on',tab==='activos');
  document.getElementById('tabPrestamos').classList.toggle('on',tab==='prestamos');
  document.getElementById('tabRetirados').classList.toggle('on',tab==='retirados');
}

function filtrarUsuarios(q){
  const term=(q||'').toLowerCase().trim();
  document.querySelectorAll('.usuario-card').forEach(card=>{
    const search=card.dataset.search||'';
    card.style.display=(!term||search.includes(term))?'':'none';
  });
}

        <div style="margin-bottom:8px"><label>¿Tiene usuario xcargo propio?</label>

            <option value="true" ${datos.usuario_propio!==false?'selected':''}>Sí — tiene usuario propio</option>
            <option value="false" ${datos.usuario_propio===false?'selected':''}>No — usa usuario prestado</option>
          </select>
        </div>
        <div id="campoXcargoPropio" style="${datos.usuario_propio!==false?'':'display:none'}">
          <label>Correo usuario xcargo propio</label>
          <input class="inp" id="unUsuarioPropio" placeholder="correo@gmail.com" value="${esc(datos.usuario_xcargo||'')}">
        </div>
        <div id="campoXcargoPrestado" style="${datos.usuario_propio===false?'':'display:none'}">
          <label>Usuario xcargo prestado</label>
          <select class="inp sel" id="unUsuarioPrestado">
            <option value="">— Selecciona un usuario disponible —</option>
            ${(window._usuariosDisponibles||[]).map(u=>`
              <option value="${esc(u.usuario_xcargo)}" ${(datos.usuario_xcargo_prestado||datos.usuario_xcargo)===u.usuario_xcargo?'selected':''}>
                ${esc(u.nombre)} · ${esc(u.usuario_xcargo)}${u.placa?' · '+esc(u.placa):''}
              </option>`).join('')}
            ${datos.usuario_xcargo_prestado&&!(window._usuariosDisponibles||[]).find(u=>u.usuario_xcargo===datos.usuario_xcargo_prestado)?
              `<option value="${esc(datos.usuario_xcargo_prestado)}" selected>${esc(datos.usuario_xcargo_prestado)} (en uso actual)</option>`:''
            }
          </select>
          <div style="font-size:var(--fss);color:var(--tx3);margin-top:4px">Solo se muestran usuarios disponibles del pool</div>
        </div>
      </div>

      <button class="btn btn-p btn-w" onclick="guardarUsuario()">
        ${esEdicion?'Guardar cambios ✓':'Crear usuario ✓'}
      </button>
      ${esEdicion?`<button class="btn btn-o btn-w btn-s" onclick="S._userEditId=null;go('usuarios')">Cancelar</button>`:''}
    </div>
  `);
}

function toggleCampoXcargo(){
  const propio=document.getElementById('unPropio')?.value==='true';
  const elPropio=document.getElementById('campoXcargoPropio');
  const elPrest=document.getElementById('campoXcargoPrestado');
  if(elPropio)elPropio.style.display=propio?'block':'none';
  if(elPrest)elPrest.style.display=propio?'none':'block';
}

async function guardarUsuario(){
  const esEdicion=!!S._userEditId;
  const nombre=document.getElementById('unNombre')?.value?.trim();
  const doc=document.getElementById('unDoc')?.value?.trim()||null;
  const tel=document.getElementById('unTel')?.value?.trim()||null;
  const dir=document.getElementById('unDir')?.value?.trim()||null;
  const correo=document.getElementById('unCorreo')?.value?.trim()||null;
  const placa=document.getElementById('unPlaca')?.value?.trim().toUpperCase()||null;
  const zona=document.getElementById('unZona')?.value||null;
  const fechaIngreso=document.getElementById('unFechaIngreso')?.value||null;
  const banco=document.getElementById('unBanco')?.value||null;
  const tipoCuenta=document.getElementById('unTipoCuenta')?.value||null;
  const numCuenta=document.getElementById('unNumCuenta')?.value?.trim()||null;
  const usuarioPropio=document.getElementById('unPropio')?.value==='true';
  // Si tiene usuario propio → guardar en usuario_xcargo y limpiar prestado
  // Si usa prestado → guardar en usuario_xcargo_prestado y limpiar propio
  const usuarioXcargo       = usuarioPropio ? (document.getElementById('unUsuarioPropio')?.value?.trim().toLowerCase()||null) : null;
  const usuarioXcargoPrest  = usuarioPropio ? null : (document.getElementById('unUsuarioPrestado')?.value?.trim().toLowerCase()||null);

  if(!nombre){toast('El nombre es obligatorio','er');return;}

  const payload={
    nombre_completo:nombre,
    num_documento:doc,
    telefono:tel,
    direccion:dir,
    correo:correo,
    placa:placa,
    zona_principal:zona,
    fecha_ingreso:fechaIngreso||null,
    usuario_xcargo:usuarioXcargo,
    usuario_xcargo_prestado:usuarioXcargoPrest,
    usuario_propio:usuarioPropio,
    banco:banco,
    num_cuenta:numCuenta,
    tipo_cuenta:tipoCuenta||null,
  };

  try{
    if(esEdicion){
      const{error}=await sb.from('mensajeros').update(payload).eq('id',S._userEditId);
      if(error)throw error;
      toast('Usuario actualizado ✓','ok');
      S._userId=S._userEditId;
      S._userNombre=nombre;
      S._userEditId=null;
      go('usuario-detalle');
    } else {
      const{error}=await sb.from('mensajeros').insert({...payload,activo:true});
      if(error)throw error;
      toast('Usuario creado ✓','ok');
      go('usuarios');
    }
  }catch(e){
    toast('Error: '+e.message,'er');
  }
}

async function toggleUsuarioActivo(id, nombre, activo){
  if(activo){
    // ── FLUJO DE RETIRO ──
    // Obtener datos completos del mensajero
    const{data:m}=await sb.from('mensajeros')
      .select('usuario_propio,usuario_xcargo,usuario_xcargo_prestado')
      .eq('id',id).single();

    const tienePropio = m?.usuario_propio && m?.usuario_xcargo;
    const tienePrestado = m?.usuario_xcargo_prestado;

    // Construir botones según el caso
    const botonesRetiro=[
      {l:'Cancelar', fn:closeDlg},
      {l:'Registrar retiro', c:'btn-d', fn:async()=>{
        closeDlg();

        if(tienePropio){
          // Preguntar qué hacer con el usuario propio
          dialog(
            'Usuario xcargo propio',
            `${nombre} tiene usuario xcargo propio (${m.usuario_xcargo}).\n¿Qué deseas hacer con él?`, '',
            [
              {l:'Cancelar', fn:closeDlg},
              {l:'Guardar para usar después', c:'btn-o', fn:async()=>{
                closeDlg();
                // Mover a usuarios_prestamo como disponible
                await sb.from('usuarios_prestamo').insert({
                  nombre: `[Disponible] ${nombre}`,
                  usuario_xcargo: m.usuario_xcargo,
                  activo: true
                });
                await retirarMensajero(id, nombre, null);
              }},
              {l:'Inactivarlo', c:'btn-d', fn:async()=>{
                closeDlg();
                await retirarMensajero(id, nombre, null);
              }}
            ]
          );
        } else {
          // Sin usuario propio — solo retirar y liberar prestado
          await retirarMensajero(id, nombre, tienePrestado ? m.usuario_xcargo_prestado : null);
        }
      }}
    ];

    dialog(
      'Registrar retiro',
      `¿Registrar el retiro de ${nombre}?\n\nSu historial de paquetes se conserva para liquidar al final de la quincena.`,
      '',
      botonesRetiro
    );

  } else {
    // ── REACTIVAR ──
    dialog(
      'Reactivar mensajero',
      `¿Reactivar a ${nombre}?`, '',
      [
        {l:'Cancelar', fn:closeDlg},
        {l:'Reactivar', c:'btn-g', fn:async()=>{
          closeDlg();
          await sb.from('mensajeros').update({activo:true, fecha_retiro:null}).eq('id',id);
          toast(`${nombre} reactivado ✓`,'ok');
          S._userId=id; S._userNombre=nombre;
          go('usuario-detalle');
        }}
      ]
    );
  }
}

async function retirarMensajero(id, nombre, correoPrestadoALiberar){
  const hoy=new Date().toISOString().slice(0,10);

  // Obtener datos actuales para preservar el historial
  const{data:m}=await sb.from('mensajeros').select('usuario_xcargo_prestado,usuario_xcargo').eq('id',id).single();

  // Al retirar: mover usuario_xcargo_prestado a usuario_xcargo_anterior
  // para que el sistema siga reconociendo sus entregas históricas
  const updateData={
    activo: false,
    fecha_retiro: hoy,
    usuario_xcargo_prestado: null,
  };

  // Si tenía usuario prestado, guardarlo como anterior con fecha de corte = hoy
  if(m?.usuario_xcargo_prestado){
    updateData.usuario_xcargo_anterior=m.usuario_xcargo_prestado;
    updateData.fecha_cambio_usuario=hoy;
  } else if(m?.usuario_xcargo){
    // Si tenía usuario propio, también guardarlo como anterior
    updateData.usuario_xcargo_anterior=m.usuario_xcargo;
    updateData.fecha_cambio_usuario=hoy;
  }

  await sb.from('mensajeros').update(updateData).eq('id',id);

  // 2. Si tenía usuario prestado → marcarlo como disponible en el pool
  if(correoPrestadoALiberar){
    await sb.from('usuarios_prestamo')
      .update({activo:true})
      .eq('usuario_xcargo', correoPrestadoALiberar);
    toast(`Usuario prestado (${correoPrestadoALiberar}) liberado y disponible de nuevo`,'ok');
  }

  toast(`Retiro de ${nombre} registrado. Su historial queda para liquidación final ✓`,'ok');
  go('usuarios');
}

async function usuHandleFile(file){
  if(!file)return;
  const res=document.getElementById('usuImportResult');
  res.innerHTML=loader();
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});

    // Hoja MENSAJEROS
    const shMens=wb.Sheets['MENSAJEROS'];
    // Hoja USUARIOS DISPO PARA PRESTAMO
    const shPrest=wb.Sheets['USUARIOS DISPO PARA PRESTAMO'];

    if(!shMens){res.innerHTML='<p style="color:var(--red)">No se encontró hoja "MENSAJEROS"</p>';return;}

    const rowsMens=XLSX.utils.sheet_to_json(shMens,{defval:''});
    const rowsPrest=shPrest?XLSX.utils.sheet_to_json(shPrest,{defval:''}):[];

    // Preview
    res.innerHTML=`
      <div class="card" style="cursor:default;margin-top:14px">
        <div style="font-weight:600;margin-bottom:10px">Vista previa</div>
        <div class="stat-row">
          <div class="stat"><div class="stat-n">${rowsMens.length}</div><div class="stat-l">Mensajeros</div></div>
          <div class="stat"><div class="stat-n">${rowsPrest.length}</div><div class="stat-l">Usuarios préstamo</div></div>
        </div>
        <table class="tbl" style="margin-top:8px">
          <tr><th>Nombre</th><th>Doc</th><th>Placa</th></tr>
          ${rowsMens.slice(0,4).map(r=>`<tr>
            <td>${esc(String(r['MENSAJERO']||''))}</td>
            <td style="font-family:var(--mo)">${esc(String(r['NRO. DOCUMENTO']||''))}</td>
            <td style="font-family:var(--mo)">${esc(String(r['PLACA']||''))}</td>
          </tr>`).join('')}
          ${rowsMens.length>4?`<tr><td colspan="3" style="color:var(--tx3)">... y ${rowsMens.length-4} más</td></tr>`:''}
        </table>
      </div>
      <button class="btn btn-g btn-w" style="margin-top:10px" onclick="usuDoImport()">
        Importar ${rowsMens.length} mensajeros${rowsPrest.length?` + ${rowsPrest.length} préstamo`:''}
      </button>
    `;
    window._usuData={rowsMens,rowsPrest};
  }catch(e){res.innerHTML=`<p style="color:var(--red)">${esc(e.message)}</p>`;}
}

async function usuDoImport(){
  const{rowsMens,rowsPrest}=window._usuData||{rowsMens:[],rowsPrest:[]};
  const res=document.getElementById('usuImportResult');
  res.innerHTML=loader();
  let okMens=0,okPrest=0;
  const errores=[];

  // ── Importar mensajeros ──
  for(const r of rowsMens){
    const nombre=String(r['MENSAJERO']||'').trim();
    if(!nombre){errores.push('Fila sin nombre, se omitió');continue;}

    const doc=String(r['NRO. DOCUMENTO']||'').trim()||null;
    const tel=String(r['TELEFONO']||'').trim()||null;
    const dir=String(r['DIRECCION']||'').trim()||null;
    const correo=String(r['Correo']||'').trim().toLowerCase()||null;
    const placa=String(r['PLACA']||'').trim().toUpperCase()||null;
    const claveRaw=String(r['CONTRASEÑA']||'').trim()||null;
    const claveEnc=claveRaw ? await encryptText(claveRaw) : null;
    const usuarioPropio=String(r['USUARIO PROPIO']||'').trim().toUpperCase()==='SI';
    const usuarioActual=String(r['USUARIO ACTUAL']||'').trim().toLowerCase()||null;
    const usuarioXcargo      = usuarioPropio ? (usuarioActual||correo) : null;
    const usuarioXcargoPrest = usuarioPropio ? null : usuarioActual;
    // Usuario anterior y fecha de cambio (para mensajeros que cambiaron de usuario)
    const usuarioAnteriorRaw=String(r['USUARIO ANTERIOR']||'').trim().toLowerCase()||null;
    const usuarioAnterior = usuarioAnteriorRaw||null;
    let fechaCambio=null;
    const fechaCambioRaw=r['FECHA DE CAMBIO A USUARIO ACTUAL'];
    if(fechaCambioRaw){
      if(typeof fechaCambioRaw==='number'){
        try{const d=XLSX.SSF.parse_date_code(fechaCambioRaw);fechaCambio=`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;}catch(e){}
      } else if(typeof fechaCambioRaw==='string'&&fechaCambioRaw.trim()){
        fechaCambio=fechaCambioRaw.trim().slice(0,10);
      } else if(fechaCambioRaw instanceof Date){
        fechaCambio=fechaCambioRaw.toISOString().slice(0,10);
      }
    }

    // Fecha de ingreso — puede ser número serial Excel o texto
    let fechaIngreso=null;
    const fechaRaw=r['FECHA DE INGRESO'];
    if(fechaRaw){
      if(typeof fechaRaw==='number'){
        try{const d=XLSX.SSF.parse_date_code(fechaRaw);fechaIngreso=`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;}catch(e){}
      } else {
        const s=String(fechaRaw).trim();
        // Intentar parsear texto como fecha
        if(/^\d{4}-\d{2}-\d{2}$/.test(s)) fechaIngreso=s;
      }
    }

    // Si ya existe por documento, hacer update en lugar de insert
    try{
      let error;
      if(doc){
        // Intentar update primero si tiene documento
        const{data:existe}=await sb.from('mensajeros').select('id').eq('num_documento',doc).maybeSingle();
        if(existe){
          ({error}=await sb.from('mensajeros').update({
            nombre_completo:nombre,telefono:tel,direccion:dir,correo,placa,
            fecha_ingreso:fechaIngreso,usuario_xcargo:usuarioXcargo,
            usuario_xcargo_prestado:usuarioXcargoPrest,usuario_propio:usuarioPropio,usuario_xcargo_anterior:usuarioAnterior,fecha_cambio_usuario:fechaCambio,clave_enc:claveEnc,activo:true
          }).eq('id',existe.id));
        } else {
          ({error}=await sb.from('mensajeros').insert({
            nombre_completo:nombre,num_documento:doc,telefono:tel,direccion:dir,correo,placa,
            fecha_ingreso:fechaIngreso,usuario_xcargo:usuarioXcargo,
            usuario_xcargo_prestado:usuarioXcargoPrest,usuario_propio:usuarioPropio,usuario_xcargo_anterior:usuarioAnterior,fecha_cambio_usuario:fechaCambio,clave_enc:claveEnc,activo:true
          }));
        }
      } else {
        // Sin documento: insert directo
        ({error}=await sb.from('mensajeros').insert({
          nombre_completo:nombre,num_documento:null,telefono:tel,direccion:dir,correo,placa,
          fecha_ingreso:fechaIngreso,usuario_xcargo:usuarioXcargo,
          usuario_xcargo_prestado:usuarioXcargoPrest,usuario_propio:usuarioPropio,usuario_xcargo_anterior:usuarioAnterior,fecha_cambio_usuario:fechaCambio,clave_enc:claveEnc,activo:true
        }));
      }
      if(error)throw error;
      okMens++;
    }catch(e){
      errores.push(`${nombre}: ${e.message}`);
    }
  }

  // ── Importar usuarios de préstamo ──
  for(const r of rowsPrest){
    const nombre=String(r['NOMBRE']||'').trim();
    if(!nombre){errores.push('Fila préstamo sin nombre, se omitió');continue;}
    const usuario=String(r['USUARIO']||'').trim().toLowerCase()||null;
    const placa=String(r['PLACA']||'').trim().toUpperCase()||null;
    const claveRawP=String(r['CONTRASEÑA']||'').trim()||null;
    const claveEncP=claveRawP?await encryptText(claveRawP):null;
    try{
      let error;
      if(usuario){
        const{data:existe}=await sb.from('usuarios_prestamo').select('id').eq('usuario_xcargo',usuario).maybeSingle();
        if(existe){
          ({error}=await sb.from('usuarios_prestamo').update({nombre,placa,activo:true,clave_enc:claveEncP}).eq('id',existe.id));
        } else {
          ({error}=await sb.from('usuarios_prestamo').insert({nombre,usuario_xcargo:usuario,placa,activo:true,clave_enc:claveEncP}));
        }
      } else {
        ({error}=await sb.from('usuarios_prestamo').insert({nombre,usuario_xcargo:null,placa,activo:true,clave_enc:claveEncP}));
      }
      if(error)throw error;
      okPrest++;
    }catch(e){
      errores.push(`Préstamo ${nombre}: ${e.message}`);
    }
  }

  const hayErrores=errores.length>0;
  res.innerHTML=`
    <div class="card" style="cursor:default;border-color:${hayErrores?'var(--amb)':'var(--grn)'};margin-top:10px">
      <div style="color:${hayErrores?'var(--amb)':'var(--grn)'};font-weight:600;margin-bottom:6px">
        ${hayErrores?'Importación con advertencias':'✓ Importación completada'}
      </div>
      <div style="font-size:var(--fss);color:var(--tx2);margin-bottom:${hayErrores?'10px':'0'}">
        ✓ ${okMens} mensajeros · ✓ ${okPrest} usuarios préstamo${hayErrores?' · ⚠️ '+errores.length+' errores':''}
      </div>
      ${hayErrores?`<div style="max-height:150px;overflow-y:auto;border-top:1px solid var(--brd);padding-top:8px">
        ${errores.map(e=>`<div style="font-size:10px;color:var(--red);margin-bottom:3px;word-break:break-all">• ${esc(e)}</div>`).join('')}
      </div>`:''}
    </div>
    ${(okMens>0||okPrest>0)?`<button class="btn btn-p btn-w" style="margin-top:10px" onclick="go('usuarios')">Ver usuarios →</button>`:''}
  `;
  if(okMens>0||okPrest>0)toast(`${okMens+okPrest} usuarios importados ✓`,'ok');
}

// ── Ver clave xcargo (solo admin con reautenticación) ──
async function verClaveXcargo(mensajeroId, nombreMensajero){
  // Abrir diálogo custom con input de contraseña
  const dlg=document.getElementById('dlg');
  document.getElementById('dlgT').textContent='Verificación requerida';
  document.getElementById('dlgM').textContent=`Para ver la clave de ${nombreMensajero} confirma tu contraseña de acceso.`;
  const gEl=document.getElementById('dlgG');
  gEl.innerHTML=`<input class="inp" id="dlgReauthPwd" type="password" placeholder="Tu contraseña" autocomplete="current-password" style="margin-top:8px">`;
  gEl.style.display='block';
  const aEl=document.getElementById('dlgA');
  aEl.innerHTML='';
  const btnCancel=document.createElement('button');
  btnCancel.className='btn btn-o btn-s';btnCancel.textContent='Cancelar';
  btnCancel.onclick=closeDlg;
  const btnOk=document.createElement('button');
  btnOk.className='btn btn-p btn-s';btnOk.textContent='Confirmar';
  btnOk.onclick=async()=>{
    const pwd=document.getElementById('dlgReauthPwd')?.value||'';
    if(!pwd){toast('Ingresa tu contraseña','er');return;}
    closeDlg();
    const email=S.user?.email;
    const{error:authErr}=await sb.auth.signInWithPassword({email,password:pwd});
    if(authErr){toast('Contraseña incorrecta','er');return;}
    // Obtener clave encriptada
    const{data:m}=await sb.from('mensajeros').select('clave_enc,usuario_xcargo').eq('id',mensajeroId).single();
    if(!m?.clave_enc){toast('No hay clave guardada','wa');return;}
    const claveDesc=await decryptText(m.clave_enc);
    if(!claveDesc){toast('Error al descifrar','er');return;}
    mostrarClaveDialog(nombreMensajero, m.usuario_xcargo||'—', claveDesc);
  };
  aEl.appendChild(btnCancel);aEl.appendChild(btnOk);
  dlg.classList.add('open');
  setTimeout(()=>document.getElementById('dlgReauthPwd')?.focus(),150);
}

function mostrarClaveDialog(nombre, usuario, clave){
  let seg=30;
  const dlg=document.getElementById('dlg');
  document.getElementById('dlgT').textContent='Clave xcargo';

// ── Descarga masiva de recibos de una quincena ──
async function descargarTodosRecibos(quinId, quinNombre){
  toast('Preparando recibos...','ok');

  const[{data:mensajeros},{data:quinData}]=await Promise.all([
    sb.from('quincena_mensajeros')
      .select('id,nombre_display,mensajero_id,correo_xcargo,total_bruto,total_entregas')
      .eq('quincena_id',quinId)
      .not('mensajero_id','is',null) // Solo los que tienen match en BD
      .order('nombre_display'),
    sb.from('quincenas').select('mes,año,quincena').eq('id',quinId).single(),
  ]);

  if(!mensajeros?.length||!quinData){toast('Sin datos para generar','wa');return;}

  // Descuentos pendientes de todos
  const mensIds=mensajeros.map(m=>m.mensajero_id);
  const{data:todosDescs}=await sb.from('descuentos')
    .select('mensajero_id,id,concepto,valor,numero_guia')
    .in('mensajero_id',mensIds)
    .eq('mes_quincena',quinData.mes).eq('año_quincena',quinData.año)
    .eq('quincena',quinData.quincena).eq('aplicado',false);

  const descPorMens={};
  (todosDescs||[]).forEach(d=>{
    if(!descPorMens[d.mensajero_id]) descPorMens[d.mensajero_id]=[];
    descPorMens[d.mensajero_id].push(d);
  });

  // Datos de mensajeros (banco, cuenta, etc.)
  const{data:mensDB}=await sb.from('mensajeros')
    .select('id,nombre_completo,num_documento,telefono,placa,banco,num_cuenta,tipo_cuenta')
    .in('id',mensIds);
  const mensDBMap={};
  (mensDB||[]).forEach(m=>mensDBMap[m.id]=m);

  let generados=0;
  for(const qm of mensajeros){
    // Obtener detalle del mensajero
    const{data:detalle}=await sb.from('quincena_detalle')
      .select('dia,fecha,entregas,valor')
      .eq('quincena_mensajero_id',qm.id)
      .order('dia');

    const mens=mensDBMap[qm.mensajero_id]||{nombre_completo:qm.nombre_display};
    const descs=descPorMens[qm.mensajero_id]||[];
    const totalDescuentos=descs.reduce((s,d)=>s+Number(d.valor||0),0);

    const p={
      mensajero:mens.nombre_completo||qm.nombre_display,
      mes:quinData.mes,
      año:quinData.año,
      quincena:quinData.quincena==='Q1'?'Primera quincena':'Segunda quincena',
      resumen:(detalle||[]).map(d=>({dia:d.dia,paquetes:d.entregas,valor:d.valor})),
      totalBruto:Number(qm.total_bruto),
      totalDescuentos,
      totalNeto:Number(qm.total_bruto)-totalDescuentos,
      descuentosPend:descs,
    };

    try{
      generarReciboPDF(p, mens, qm.id);
      generados++;
      // Pequeña pausa entre PDFs para no saturar el browser
      await new Promise(r=>setTimeout(r,400));
    }catch(e){
      console.error('Error generando recibo de',qm.nombre_display,e);
    }
  }
  toast(`${generados} recibos descargados ✓`,'ok');
}
async function verReciboGuardado(liqId){
  setBar('Recibo','Nómina');
  setP(loader());

  const[{data:liq},{data:detalle},{data:descs}]=await Promise.all([
    sb.from('liquidaciones')
      .select('id,mes,año,quincena,total_bruto,total_descuentos,total_neto,created_at,mensajeros(nombre_completo,num_documento,telefono,placa)')
      .eq('id',liqId).single(),
    sb.from('liquidaciones_detalle')
      .select('dia,fecha,entregas,valor')
      .eq('liquidacion_id',liqId)
      .order('dia'),
    sb.from('descuentos')
      .select('id,concepto,valor,numero_guia')

      .eq('liquidacion_aplicada_id',liqId),
  ]);

  const mens=liq.mensajeros||{};

    <!-- Cabecera recibo -->

      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px">
        <div>
          <div style="font-weight:700;font-size:clamp(15px,4vw,17px)">${esc(mens.nombre_completo||'—')}</div>
          <div style="font-size:var(--fss);color:var(--tx2);margin-top:2px">
            ${mens.num_documento?'CC '+esc(mens.num_documento):''}
            ${mens.placa?' · 🏍 '+esc(mens.placa):''}
          </div>
        </div>
        <div style="text-align:right">
          <span class="chip">${MESES_ES[liq.mes]} ${liq.año} · ${liq.quincena}</span>
          <div style="font-size:var(--fss);color:var(--tx3);margin-top:4px">#${reciboNum}</div>
        </div>
      </div>

      <!-- Totales -->
      <div class="stat-row" style="margin-bottom:0">
        <div class="stat"><div class="stat-n" style="color:var(--acc);font-size:clamp(13px,3.5vw,15px)">${fmtCOP(liq.total_bruto)}</div><div class="stat-l">Bruto</div></div>
        <div class="stat"><div class="stat-n" style="color:${liq.total_descuentos>0?'var(--red)':'var(--tx3)'};font-size:clamp(13px,3.5vw,15px)">${fmtCOP(liq.total_descuentos)}</div><div class="stat-l">Descuentos</div></div>
        <div class="stat" style="background:rgba(16,185,129,.08);border-radius:var(--r2)"><div class="stat-n" style="color:var(--grn);font-size:clamp(14px,4vw,17px)">${fmtCOP(liq.total_neto)}</div><div class="stat-l">Total neto</div></div>
      </div>
    </div>
  `;

  // Detalle por día
  if(detalle?.length){
    h+=`<div class="sec-title">Detalle de entregas</div>
    <div style="overflow-x:auto;margin-bottom:12px">
      <table class="tbl">
        <thead><tr><th>Día</th><th>Fecha</th><th>Entregas</th><th>Valor</th></tr></thead>
        <tbody>
          ${detalle.map(d=>`<tr>
            <td>${d.dia}</td>
            <td style="color:var(--tx2)">${d.fecha?new Date(d.fecha+'T12:00:00').toLocaleDateString('es-CO',{weekday:'short',day:'2-digit',month:'short'}):'—'}</td>
            <td style="font-family:var(--mo);color:var(--acc)">${d.entregas}</td>
            <td style="font-family:var(--mo);color:var(--grn)">${fmtCOP(d.valor)}</td>
          </tr>`).join('')}
          <tr style="font-weight:700;background:var(--bg2)">
            <td colspan="2">Total</td>
            <td style="font-family:var(--mo)">${detalle.reduce((s,d)=>s+d.entregas,0)}</td>
            <td style="font-family:var(--mo);color:var(--grn)">${fmtCOP(liq.total_bruto)}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
  } else {
    h+=`<div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:var(--r2);padding:10px 12px;font-size:var(--fss);color:var(--amb);margin-bottom:12px">

  }

  // Descuentos aplicados
  if(descs?.length){
    h+=`<div class="sec-title" style="color:var(--red)">Descuentos aplicados</div>`;
    descs.forEach(d=>{

    <button class="btn btn-o btn-s" style="flex:1" onclick="go('nomina-home')">← Volver</button>
  </div>`;

  setP(h);
  // Guardar en S para poder generar el PDF
  S._reciboVer={liq,detalle:detalle||[],descs:descs||[]};
}

async function descargarReciboGuardado(liqId){
  const r=S._reciboVer;
  if(!r){toast('Carga el recibo primero','er');return;}
  const{liq,detalle,descs}=r;
  const mens=liq.mensajeros||{};

  // Construir el objeto p compatible con generarReciboPDF
  const resumen=detalle.map(d=>({dia:d.dia,paquetes:d.entregas,valor:d.valor}));
  const p={
    mensajero:mens.nombre_completo||'—',
    mes:liq.mes,año:liq.año,quincena:liq.quincena,
    resumen,
    totalBruto:liq.total_bruto,
    totalDescuentos:liq.total_descuentos,
    totalNeto:liq.total_neto,
    descuentosPend:descs,
  };
  generarReciboPDF(p,mens,liqId);
  toast('PDF generado ✓','ok');
}

// ── Número a letras (pesos colombianos) ──
function numALetras(n){
  const u=['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE',
           'DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE'];
  const d=['','','VEINTE','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  const c=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  function grupo(n){
    const s=String(Math.floor(n)).padStart(3,'0');
    const c1=Number(s[0]),d1=Number(s[1]),u1=Number(s[2]);
    let r='';
    if(c1>0) r+=(c1===1&&d1===0&&u1===0?'CIEN':c[c1])+' ';
    if(d1===1) r+=u[10+u1]+' ';
    else if(d1===2) r+=(u1===0?'VEINTE':'VEINTI'+u[u1])+' ';
    else if(d1>2) r+=d[d1]+(u1>0?' Y '+u[u1]:'')+' ';
    else if(d1===0&&u1>0) r+=u[u1]+' ';
    return r.trim();
  }
  n=Math.round(Number(n));
  if(n===0) return 'CERO PESOS M/CTE';
  let r='';
  const mill=Math.floor(n/1000000);
  const mil=Math.floor((n%1000000)/1000);
  const res=n%1000;
  if(mill>0) r+=(mill===1?'UN MILLÓN':grupo(mill)+' MILLONES')+' ';
  if(mil>0) r+=(mil===1?'MIL':grupo(mil)+' MIL')+' ';
  if(res>0) r+=grupo(res);
  return r.trim()+' PESOS M/CTE';
}
